<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness 学习站</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2329;
    --muted: #6b7280;
    --brand: #4e83fd;
    --brand-dark: #3b6ff0;
    --code-bg: #f0f2f5;
    --tip-bg: #eef6ff;
    --tip-border: #4e83fd;
    --warn-bg: #fff7e6;
    --warn-border: #f5a623;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
    font-size: 15px;
  }
  .layout { display: flex; height: 100vh; }
  /* 侧边栏 */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-head .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--brand);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .sidebar-head .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--brand); }
  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .nav-group { margin-bottom: 4px; }
  .nav-group-title {
    padding: 8px 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-group-title:hover { color: var(--text); }
  .nav-group-title .arrow { transition: transform .2s; font-size: 10px; }
  .nav-group.collapsed .arrow { transform: rotate(-90deg); }
  .nav-item {
    display: block;
    padding: 6px 20px 6px 32px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: #f3f4f6; }
  .nav-item.active {
    color: var(--brand);
    border-left-color: var(--brand);
    background: #eef3ff;
    font-weight: 600;
  }
  .nav-group.collapsed .nav-item { display: none; }
  /* 主内容 */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px 64px;
  }
  .content { max-width: 860px; margin: 0 auto; }
  .content h1 { font-size: 28px; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .content h2 { font-size: 22px; margin: 32px 0 12px; }
  .content h3 { font-size: 18px; margin: 24px 0 10px; }
  .content h4 { font-size: 16px; margin: 20px 0 8px; }
  .content p { margin: 8px 0; }
  .content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  .content pre {
    background: #1f2329;
    color: #e6e8eb;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
  }
  .content pre code { background: none; padding: 0; color: inherit; }
  .content table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: 14px; }
  .content th, .content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .content th { background: #f9fafb; font-weight: 600; }
  .content a { color: var(--brand); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content ul, .content ol { padding-left: 24px; margin: 8px 0; }
  .content li { margin: 4px 0; }
  .content blockquote {
    margin: 12px 0;
    padding: 8px 16px;
    border-left: 4px solid var(--border);
    color: var(--muted);
    background: #f9fafb;
    border-radius: 0 6px 6px 0;
  }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .content .tip, .content .warning {
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 8px;
    border-left: 4px solid;
    font-size: 14px;
  }
  .content .tip { background: var(--tip-bg); border-color: var(--tip-border); }
  .content .warning { background: var(--warn-bg); border-color: var(--warn-border); }
  .content .tip .ttl, .content .warning .ttl { font-weight: 700; display: block; margin-bottom: 4px; }
  /* 首页英雄区 */
  .hero { text-align: center; padding: 60px 0 40px; }
  .hero h1 { font-size: 40px; margin: 0 0 8px; border: none; padding: 0; }
  .hero .subtitle { font-size: 18px; color: var(--muted); margin: 8px 0 24px; }
  .hero .badge { display: inline-block; background: #eef3ff; color: var(--brand); padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-bottom: 16px; }
  .hero-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 32px; text-align: left; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: box-shadow .2s, transform .2s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-2px); }
  .card .icon { font-size: 28px; }
  .card .title { font-weight: 700; font-size: 16px; margin: 8px 0; }
  .card .desc { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  @media (max-width: 768px) {
    .sidebar { width: 240px; min-width: 240px; }
    .main { padding: 24px; }
  }
</style>
</head>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo" onclick="goHome()">🔷 DeepSeek Harness 学习站</div>
      <div class="sub">一个"一切皆插件"的 AI Agent 框架</div>
    </div>

    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="content" id="content"></div>
  </main>
</div>

7-descriptions:subagent_tool-subagent-report_report-description_prompt_zh.md","title":"report"},{"id":"07-descriptions:todo_tool-todo_todo-write-description_prompt_zh.md","title":"describe"},{"id":"07-descriptions:workflow_tool-workflow_workflow-description_prompt_zh.md","title":"DESCRIPTION"}]},{"id":"08-interaction","label":"交互与钩子提示词","items":[{"id":"08-interaction:context_time-context_browser-timezone-context_prompt_zh.md","title":"renderBrowserTimeZoneContext"},{"id":"08-interaction:hooks_default-deny-block-feedback_prompt_zh.md","title":"hooks 默认 deny/block 反馈（Claude Code + Codex）"},{"id":"08-interaction:interaction_tool-ask-user_ask-user-description_prompt_zh.md","title":"description"},{"id":"08-interaction:interaction_user-approval_approval-policy-change_prompt_zh.md","title":"setPolicy"},{"id":"08-interaction:interaction_user-questions_delegated-caller-error_prompt_zh.md","title":"UserQuestionError"},{"id":"08-interaction:session_session-checkpoint-policy_aborted-result_prompt_zh.md","title":"abortedBeforeDispatchResult"}]},{"id":"09-results","label":"工具结果与定时提示","items":[{"id":"09-results:context_agent-instructions_change-templates_prompt_zh.md","title":"additionalSectionText"},{"id":"09-results:fs_tool-str-replace-editor_default-description_prompt_zh.md","title":"DEFAULT_DESCRIPTION"},{"id":"09-results:schedule_schedule_reminder-framing_prompt_zh.md","title":"renderReminderFraming"},{"id":"09-results:shell_tool-bash-persistent_default-description-and-messages_prompt_zh.md","title":"TRUNCATED_MESSAGE"},{"id":"09-results:web_tool-web_truncation-footer_prompt_zh.md","title":"TRUNCATION_FOOTER"}]}],"contents":{"analysis":"# DeepSeek Harness (dsh) 大模型应用分析报告\n\n> 项目来源：https://github.com/deepseek-ai/deepseek-harness\n> 分析日期：2026-08-14\n> 项目类型：多智能体框架 / AI Agent 平台\n\n---\n\n## 第 1 章：项目概述\n\n### 项目名称\nDeepSeek Harness（`dsh`）\n\n### 项目描述\nDeepSeek Harness 是 DeepSeek AI 开发的开源 Agent Harness，采用\"一切皆插件（everything is a plugin）\"架构，基于 vendored 的 [Cordis](https://github.com/cordiverse/cordis) 插件系统构建。它是一个用于组装、运行和编排 AI 编码代理的框架底座——驱动着 DeepSeek 的 Web GUI（默认 `http://127.0.0.1:3080`），同时支持 headless 命令行与 ACP（Agent Client Protocol）自动化服务器三种运行形态。\n\n### 主要功能\n- **对话式编码代理**：读写文件、编辑代码、执行 shell 命令、搜索网页、调用 LSP 精确定位符号\n- **多智能体协作**：`subagent` / `subagent_fork` 工具把任务委托给独立的子代理（spawn/fork/acp 三种 provider）\n- **工作流编排**：`workflow` 工具用模型编写的 JavaScript 脚本扇出大量子代理任务\n- **长任务目标循环**：`create_goal` / `update_goal` 工具让单个会话围绕一个不可变目标自动多轮推进\n- **Fresh-agent 迭代**：`ralph` 工具以\"每轮全新子代理 + 有界结构化交接\"方式逼近目标\n- **文件沙箱安全**：read-only / workspace-write / danger-full-access 三档策略 + 审批流\n- **技能系统**：`skill` 工具加载可复用的任务指令包（SKILL.md）\n- **会话持久化与压缩**：会话日志持久化、上下文压缩（KV 缓存对齐）、会话标题自动生成\n\n### 技术栈\n- **语言**：TypeScript（ESM everywhere，`strict: true`）+ 少量 Python SDK / native（C++ landlock）\n- **插件框架**：vendored Cordis（`@deepseek-ai/cordis`）\n- **构建/包管理**：pnpm workspaces（219 个 package），tsdown / tsc\n- **前端**：VitePress + React（apps/web shell，packages/client/* 插件）\n- **运行环境**：Node.js ^22.19 || >=24\n- **数据持久化**：SQLite（会话数据）+ JSONL（会话日志）/ zstd 压缩\n\n### LLM 相关依赖及版本\n| 依赖包 | 作用 |\n|--------|------|\n| `@deepseek-ai/dsh-llm` | LLM 服务定义层（Service Definition / Consumer，provider 抽象、消息/工具类型） |\n| `@deepseek-ai/dsh-llm-deepseek` | DeepSeek 官方 provider（thinking/reasoningEffort 推理控制） |\n| `@deepseek-ai/dsh-llm-pi-ai` | Pi AI provider（convert 适配，消息格式转换） |\n| `@deepseek-ai/dsh-schemastery` | 配置/参数 Schema 校验（基于 zod 风格） |\n| `@deepseek-ai/dsh-token-meter` | token 计量与上下文压力投影 |\n| `@deepseek-ai/dsh-compaction-basic` | 上下文压缩（调用 LLM 做总结） |\n| `@deepseek-ai/dsh-session-title-llm` | 会话标题生成（调用 LLM） |\n\n模型（来自 `examples/headless-agent/cordis.yml` 与 `examples/acp-agent/cordis.yml`）：\n- `deepseek-v4-flash`（快模型）\n- `deepseek-v4-pro`（强模型，全思考模式 `thinking: enabled` + `reasoningEffort: max`）\n\n---\n\n## 第 2 章：项目架构与数据流\n\n### 2.1 模块级架构图\n\nDeepSeek Harness 的核心是 Cordis 插件系统：所有能力（工具、LLM provider、会话、沙箱、技能等）都以插件形式挂载到共享的 Context 上，通过服务注册与事件解耦。系统提示词由多个插件的贡献按 order 排序组装而成。\n\n```mermaid\ngraph TD\n    A[\"用户入口 (Web GUI / CLI / ACP)\"] --> B[\"apps/web + boot\"]\n    B --> C[\"agent-loop 代理循环\"]\n    C --> D[\"system-prompt 组装器\"]\n    D --> E[\"llm 服务定义层\"]\n    E --> F[\"llm-deepseek provider\"]\n    F --> G[\"DeepSeek 模型 API\"]\n    C --> H[\"tools 工具注册表\"]\n    H --> I[\"能力插件 (fs/shell/web/lsp/terminal)\"]\n    C --> J[\"session 会话持久化\"]\n    J --> K[\"SQLite / JSONL\"]\n    C --> L[\"subagent 子代理\"]\n    C --> M[\"workflow 工作流\"]\n    C --> N[\"goal / ralph 循环\"]\n    E --> O[\"compaction 压缩\"]\n    E --> P[\"session-title-llm 标题\"]\n```\n\n### 2.2 单次请求时序图\n\n一次用户输入的完整链路：agent-loop 组装请求（系统提示词 + 工具 Schema + 历史消息），经 LLM 服务定义层路由到 DeepSeek provider 流式调用，模型可能发起工具调用，工具执行后结果回填，循环直到模型给出最终答复。\n\n```mermaid\ngraph TD\n    A[\"用户输入\"] --> B[\"agent-loop 组装请求\"]\n    B --> C[\"system-prompt 渲染 section/context/tools\"]\n    C --> D[\"llm.stream 流式调用\"]\n    D --> E[\"模型返回文本或工具调用\"]\n    E -->|\"工具调用\"| F[\"tools.execute 执行工具\"]\n    F --> G[\"工具结果回填会话\"]\n    G --> B\n    E -->|\"最终文本\"| H[\"结果返回用户\"]\n```\n\n---\n\n## 第 3 章：提示词分类统计\n\n| 类别 | 数量 | 用途说明 |\n|------|------|----------|\n| 系统提示词核心层 | 5 | 身份声明、persona 模板槽、运行时上下文信封、源码检出位置、Web 界面定向 |\n| 工具使用指导层 | 19 | bash/pwsh/read/write/edit/grep/glob/web_search/web_fetch 等工具的 system-prompt 指导 + Code Mode SDK 说明 |\n| 动态上下文注入 | 7 | 沙箱策略、审批策略、子代理委托、工作区指令、技能目录、时间/tmux 上下文 |\n| 长指令提示词 | 7 | Cordis 动态插件规范、压缩指令、检查点前言、标题生成、goal/Ralph 轮次提示 |\n| 运行时修复提示词 | 3 | 上下文清除标记、崩溃修复重试指导 |\n| Agent 技能（SKILL.md） | 11 | 项目自身的开发辅助技能（归档为技能，不逐个翻译） |\n| **合计** | **41 个提示词 + 11 个技能** | |\n\n详细清单见 `translated_prompts/MANIFEST.md`，逐条中文翻译见 `translated_prompts/INDEX.md` 索引的 41 份翻译文档。\n\n---\n\n## 第 4 章：大模型应用场景分析\n\n### 场景 1: 主循环生成（核心场景）\n- **触发条件**: 每次用户输入或工具结果回填后，agent-loop 组装下一步请求\n- **使用的提示词**: [harness:identity](/prompts/01-core/core_system-prompt_harness-identity_prompt_zh)、[deployment:persona](/prompts/01-core/core_system-prompt_deployment-persona_prompt_zh)、[工具指导层全部](/prompts/)、[动态上下文](/prompts/)\n- **代码位置**: `packages/core/agent-loop/src/agent.ts`、`packages/core/system-prompt/src/index.ts`\n- **输入输出**: 输入=系统提示词 + 工具 Schema + 历史消息；输出=模型文本或工具调用\n- **模型参数**: model=deepseek-v4-flash/pro（来自 cordis.yml 路由），thinking=enabled, reasoningEffort=max\n- **作用**: 这是项目的主干——系统提示词按 order 排序组装（-100 身份 → -99 源码位置 → -98 Web 界面 → 0 persona → 99 code-only → 100-199 工具指导 → 190 文件引用），动态上下文（沙箱 110 / 审批 115 / 子代理 120）作为 user 角色持久快照注入\n\n### 场景 2: Code Mode（run_code 工具）\n- **触发条件**: 模型调用 `run_code` 工具，在受控代码运行时内执行 TypeScript/Python 程序\n- **使用的提示词**: [CODE_ONLY_INSTRUCTION](/prompts/02-tools/core_tools_code-only-instruction_prompt_zh)、[SDK_INSTRUCTIONS (TS)](/prompts/02-tools/core_tools_sdk-instructions-ts_prompt_zh)、[SDK_INSTRUCTIONS (Py)](/prompts/02-tools/core_tools_sdk-instructions-py_prompt_zh)\n- **代码位置**: `packages/core/tools/src/code-mode.ts`、`ts-types.ts`、`py-types.ts`\n- **作用**: Code Mode 收敛规则声明\"run_code 是唯一可直接调用的工具\"，程序内部通过 `await tools.name(args)` 调用其他工具；语言感知的 SDK 说明（TypeScript/Python 双风味）动态生成 `tools:sdk` section\n\n### 场景 3: 上下文压缩（compaction）\n- **触发条件**: 上下文压力达到阈值（thresholdRatio 0.8）或 provider 溢出时\n- **使用的提示词**: [COMPACTION_INSTRUCTION](/prompts/04-long/compaction_compaction-basic_compaction-instruction_prompt_zh)、[CHECKPOINT_PREAMBLE](/prompts/04-long/compaction_compaction-basic_checkpoint-preamble_prompt_zh)\n- **代码位置**: `packages/compaction/compaction-basic/src/summarizer.ts`\n- **作用**: 压缩指令作为\"最终 user 消息\"追加到回放对话后（而非独立 system prompt），使辅助调用成为上次请求的精确前缀，复用 provider 的 KV 缓存\n\n### 场景 4: 会话标题生成\n- **触发条件**: 会话需要自动标题时\n- **使用的提示词**: [会话标题系统指令](/prompts/04-long/session_session-title-llm_session-title-prompt_prompt_zh)\n- **代码位置**: `packages/session/session-title-llm/src/index.ts:186`\n- **模型参数**: maxTokens=config.maxOutputTokens，purpose=session-title，语言感知（目标词数/字符数按 CJK 区分）\n- **作用**: 辅助 LLM 调用，生成会话标题（仅返回纯文本标题）\n\n### 场景 5: 多智能体委托\n- **触发条件**: 模型调用 `subagent` / `subagent_fork` 工具委托子任务\n- **使用的提示词**: [SUBAGENT_DELEGATION_CONTEXT](/prompts/03-context/subagent_subagent_delegation-context_prompt_zh)、[Ralph round prompt](/prompts/04-long/workflow_tool-ralph_ralph-round-prompt_prompt_zh)、[goal round prompt](/prompts/04-long/goal_goal-round-driver_goal-round-prompt_prompt_zh)\n- **代码位置**: `packages/subagent/subagent/src/child-agent.ts`、`packages/workflow/tool-ralph/src/index.ts`、`packages/goal/goal-round-driver/src/prompt.ts`\n- **作用**: 子代理继承父代理的 preset 组合，叠加固定的委托范围声明（权限范围启动时固定，不可从会话内扩大）；Ralph 循环每轮派发全新子代理，只传递不可变目标 + 有界结构化交接；goal 循环以 `<goal_round>` 帧注入续接提示\n\n### 提示词链路图\n\n```mermaid\ngraph LR\n    P1[\"harness:identity 身份\"] --> P2[\"deployment:persona 人设\"]\n    P2 --> P3[\"工具指导层 100-199\"]\n    P3 --> P4[\"动态上下文 110-120\"]\n    P4 --> P5[\"llm.stream 主循环\"]\n    P5 -->|\"压力达阈值\"| P6[\"COMPACTION 压缩\"]\n    P6 --> P7[\"CHECKPOINT 检查点\"]\n```\n\n---\n\n## 第 5 章：工具清单\n\n| 工具名称 | 描述（中文） | 调用场景 | 代码位置 |\n|---------|-------------|---------|---------|\n| bash | 执行 bash 命令 | shell 命令执行 | `packages/shell/tool-bash/src/index.ts` |\n| pwsh | 执行 PowerShell 命令 | Windows 命令执行 | `packages/shell/tool-pwsh/src/index.ts` |\n| read | 读取文本文件（带行号） | 查看文件内容 | `packages/fs/tool-fs/src/read.ts` |\n| write | 创建/覆盖文件 | 写文件 | `packages/fs/tool-fs/src/write.ts` |\n| edit | 精确字符串替换编辑 | 局部修改文件 | `packages/fs/tool-fs/src/edit.ts` |\n| grep | 正则搜索文件内容 | 代码搜索 | `packages/fs/tool-fs-search/src/grep.ts` |\n| glob | glob 模式匹配文件路径 | 文件发现 | `packages/fs/tool-fs-search/src/glob.ts` |\n| web_search | 网络搜索 | 获取实时信息 | `packages/web/tool-web/src/search.ts` |\n| web_fetch | 抓取网页内容 | 读取网页 | `packages/web/tool-web/src/fetch.ts` |\n| run_code | 在代码运行时内执行程序 | Code Mode 批量操作 | `packages/core/tools/src/code-mode.ts` |\n| job_output | 读取后台任务输出 | 后台任务收集 | `packages/jobs/tool-jobs/src/index.ts` |\n| job_list | 列出后台任务 | 后台任务管理 | `packages/jobs/tool-jobs/src/index.ts` |\n| job_kill | 取消后台任务 | 后台任务管理 | `packages/jobs/tool-jobs/src/index.ts` |\n| skill | 加载技能完整指令 | 技能调用 | `packages/skill/tool-skill/src/index.ts` |\n| create_goal | 创建会话目标 | 长任务目标 | `packages/goal/tool-goal/src/index.ts` |\n| update_goal | 更新目标（edit/pause/resume/complete/blocked） | 长任务目标 | `packages/goal/tool-goal/src/index.ts` |\n| get_goal | 读取当前目标 | 长任务目标 | `packages/goal/tool-goal/src/index.ts` |\n| subagent | 委托子代理（后台可选） | 多智能体协作 | `packages/subagent/tool-subagent/src/index.ts` |\n| subagent_fork | 继承上下文的子代理 | 多智能体协作 | `packages/subagent/tool-subagent/src/index.ts` |\n| workflow | 编排工作流脚本 | 大规模扇出 | `packages/workflow/tool-workflow/src/index.ts` |\n| ralph | Fresh-agent 循环迭代 | 迭代逼近目标 | `packages/workflow/tool-ralph/src/index.ts` |\n| terminal_* | 持久终端管理 | 持久 shell 会话 | `packages/terminal/tool-terminal/src/index.ts` |\n| schedule_* | 定时任务管理 | 定时提醒 | `packages/schedule/schedule/src/tools.ts` |\n| mcp__* | MCP 工具动态桥 | 外部 MCP 服务 | `packages/mcp/tool-mcp/src/tools.ts` |\n\n### 关键工具 Schema 示例\n\n**工具名称: run_code**\n\n```json\n{\n  \"name\": \"run_code\",\n  \"description\": \"Execute a TypeScript program against the available tools...\",\n  \"parameters\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"code\": { \"type\": \"string\", \"description\": \"The program: the body of an async TypeScript function.\" },\n      \"description\": { \"type\": \"string\", \"description\": \"Clear, concise description of what this program does in active voice, 5-10 words (shown in the UI).\" }\n    },\n    \"required\": [\"code\", \"description\"]\n  }\n}\n```\n\n**工具名称: job_output**\n\n```json\n{\n  \"name\": \"job_output\",\n  \"description\": \"Read a background job...\",\n  \"parameters\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"job_id\": { \"type\": \"string\", \"description\": \"Job id returned by the tool that started the background work.\" },\n      \"wait\": { \"type\": \"boolean\", \"description\": \"Block until the job reaches a terminal status...\" },\n      \"timeout_ms\": { \"type\": \"number\", \"description\": \"Max wait in milliseconds...\" }\n    },\n    \"required\": [\"job_id\"]\n  }\n}\n```\n\n> 完整的工具 Schema（含 bash/pwsh/fs/web/schedule/terminal 等 21+ 个工具）详见各工具包的 `defineTool` 定义，参数均通过 `dsh-schemastery` Schema 校验。\n\n---\n\n## 第 6 章：模型调用参数汇总\n\n| 调用位置 | 模型 | temperature | max_tokens | 其他参数 | 用途 |\n|---------|------|-------------|------------|---------|------|\n| `examples/headless-agent/cordis.yml` | deepseek-v4-flash | 未显式设置（默认） | 未显式设置 | provider=deepseek-official | 主循环生成 |\n| `examples/acp-agent/cordis.yml` | deepseek-v4-pro | 未显式设置 | 未显式设置 | thinking=enabled, reasoningEffort=max | 主循环生成（ACP） |\n| `packages/compaction/compaction-basic` | 路由模型 | 未显式设置 | maxTokens=8192 | thresholdRatio=0.8, retainRatio=0.08 | 上下文压缩 |\n| `packages/session/session-title-llm` | 路由模型 | 未显式设置 | maxOutputTokens（配置） | purpose=session-title | 标题生成 |\n| `packages/workflow/tool-ralph` | spawn provider | 未显式设置 | 未显式设置 | maxRounds=256 | Ralph 循环 |\n\n> 模型参数主要来自 cordis.yml 配置文件（`model`、`thinking`、`reasoningEffort`），而非写死在代码中。temperature/max_tokens 多数未显式设置，依赖 provider 默认值。maxTokens 等预算参数（8192、16000 等）来自各能力包的 Config 默认值。\n\n---\n\n## 第 7 章：上下文工程\n\n### 7.1 系统提示词组装机制\n\nDeepSeek Harness 的提示词工程核心是一个**模块化 section 组装器**（`packages/core/system-prompt/src/index.ts`）：\n\n- **section**：静态文本或 provider 函数，按 `order` 升序拼接，`{{variable}}` 严格插值\n- **context**：动态上下文，渲染为 user 角色的持久快照（\"Current runtime context...\" 信封），变化时才注入\n- **variable**：提示词变量，按调用上下文求值\n- **tool schema**：工具 JSON Schema 注入，支持 toolOrder 显式排序\n- **作用域分层**：全局层 / 作用域层（子代理、preset）通过 ScopedLayers 叠加，近作用域同名覆盖\n\n**order 约定**：`-100` harness 身份 → `-99` 源码位置 → `-98` Web 界面 → `0` persona → `99` code-only → `100-199` 工具指导带 → `190` 文件引用。动态上下文用 110（沙箱）/115（审批）/120（子代理委托）。\n\n### 7.2 动态上下文快照\n\n沙箱策略、审批策略、子代理委托范围、工作区指令（AGENTS.md）、技能目录、时间/tmux 等运行时状态作为 context 注入，由 `RuntimeContextProjection` 追踪——快照变化时才生成新 user 消息，避免每轮重复注入，且快照变化通过 `system-prompt/change` 事件驱动。\n\n### 7.3 上下文压缩（compaction）\n\n压缩采用 **KV 缓存对齐**策略：压缩指令作为最终 user 消息追加到回放对话后（而非独立 system prompt），使辅助调用成为上次请求的精确前缀，复用 provider 的 warm prefix cache。压缩产出结构化检查点（`<compacted-summary>` 包裹的 8 小节），检查点作为\"已建立上下文\"替换旧消息。\n\n### 7.4 工作区指令注入\n\n`agent-instructions` 插件自动发现并注入工作区的 `AGENTS.md` / `CLAUDE.md` 指令文件，用 `<system-reminder>` 框架包裹，支持用户全局指令（`$DSH_HOME/AGENTS.md`）、项目级与嵌套包级指令，按字节预算截断。这实现了\"项目用 AI 开发自身\"的提示词闭环。\n\n### 7.5 多 Agent 协作拓扑\n\n```mermaid\ngraph TD\n    P[\"父 Agent\"] -->|\"subagent 委托\"| C1[\"子代理 spawn 全新上下文\"]\n    P -->|\"subagent_fork 继承\"| C2[\"子代理 fork 继承前缀\"]\n    P -->|\"workflow 脚本\"| W[\"worker-thread 引擎\"]\n    W --> C3[\"多个 spawn 子代理\"]\n    P -->|\"ralph 循环\"| R[\"每轮全新子代理\"]\n    R --> R2[\"结构化交接报告\"]\n```\n\n各 Agent 角色由 persona（部署级 + 每子代理 shadow）定义，子代理权限范围启动时固定（sandbox mode + approval=never），不可从会话内扩大。\n\n---\n\n## 第 8 章：关键发现与总结\n\n- **项目共发现 41 个提示词、约 21 个工具定义**（另有 11 个 Agent 技能 SKILL.md）\n- **核心使用模式：多智能体框架 / AI Agent 平台**——这是少见的\"提示词即产品\"的项目：系统提示词的组装机制本身就是核心产品能力，而非业务代码的附属\n- **提示词工程特点**：\n  - **模块化 section 组装**：提示词由数十个插件按 order 排序贡献，而非单一文件写死\n  - **动态上下文快照**：沙箱/审批/子代理/工作区/技能目录等运行时状态作为 user 角色持久快照注入，变化才更新\n  - **KV 缓存对齐压缩**：压缩指令作为前缀复用 provider 缓存，工程化程度极高\n  - **语言感知 Code Mode**：TypeScript/Python 双风味的 SDK 说明 + 收敛规则\n  - **有界结构化交接**：Ralph/goal 循环用 JSON Schema 约束子代理的轮次报告\n- **外部平台托管**：无（提示词全部内联在代码中，无 prompt_id 外部引用）\n- **亮点**：\n  - 提示词与工具 Schema 的\"模型可见 ⟺ 可日志重建\"不变式（model-visible ⟺ logged）\n  - 每个能力 seam 完整包含 Service Definition / Provider / Consumer 三角色\n  - 沙箱策略/审批策略通过 context 注入而非硬编码，安全边界清晰\n- **改进空间**：\n  - 项目处于 developer preview，兼容性会破坏（README 明确声明）\n  - 提示词分散在 219 个 package 中，新人理解组装全貌的成本较高\n  - temperature 等模型参数多数未显式配置，依赖 provider 默认值，调优空间未充分暴露\n","product-guide":"# DeepSeek Harness（dsh）产品说明书\n\n> 本说明书面向**没有编程经验**的用户，用通俗的语言介绍 DeepSeek Harness 是什么、怎么用、能做什么。遇到专业词汇时，会紧跟括号用大白话解释。\n\n---\n\n## 第 1 章：这个项目是做什么的\n\n当你需要**自己搭一个 AI 助手来帮你写代码、改文件、跑命令、查资料**的时候，DeepSeek Harness（简称 `dsh`）就是为你准备的。它像一个\"AI 助手工厂\"：装好之后，你就能拥有一个类似 ChatGPT 的对话式助手，但它是专门为\"动手干活\"设计的——不只是陪你聊天，而是真的会去读写你的文件、执行你电脑上的命令、搜索网页，然后把结果拿回来给你看。DeepSeek 自己的网页版 AI 助手（http://127.0.0.1:3080）就是由它驱动的，你可以把它理解成\"DeepSeek 官方 AI 助手的开源底座\"。\n\n它最特别的地方是**\"一切皆插件\"**：写代码、读文件、跑命令、搜网页……这些能力不是焊死的，而是像乐高积木一样可以自由拼装。你觉得某个能力不好用，可以换掉它；你觉得缺什么能力，可以自己加一块\"积木\"。这种设计让它非常灵活，既可以开箱即用，也能被深度改造。\n\n这个项目由 DeepSeek AI 公司开发并开源（免费公开源代码），使用 MIT 许可证——意味着任何人都可以免费使用、修改，甚至拿去做商业产品。目前它处于\"开发者预览\"阶段，也就是说还在快速打磨中，未来可能会有比较大的变化，但核心功能和架构已经成型，足够你上手体验了。\n\n---\n\n## 第 2 章：开始之前你需要准备什么\n\n在第一次运行之前，你需要准备三样东西。按顺序准备好，总共大约需要 **15~25 分钟**。\n\n### 1. 安装 Node.js（必需，约 5~10 分钟）\n\n- **这是什么**：一个让 JavaScript 程序（包括 dsh 本身）能跑起来的\"运行环境\"，可以理解成电脑里的一个\"程序播放器\"。\n- **怎么做**：去 Node.js 官网（https://nodejs.org）下载安装包，一路点\"下一步\"装完即可。\n- **版本要求**：需要 **22.19 或更高、24 或更高** 的版本（通俗说就是\"装新版\"）。安装完成后，可以打开\"命令提示符\"（Windows）或\"终端\"（Mac），输入 `node --version`，能看到版本号就说明装好了。\n\n### 2. 安装 pnpm（推荐，约 2~3 分钟）\n\n- **这是什么**：一个帮你\"下载和管理软件零件\"的小工具，属于可选但强烈推荐——如果你用源码方式运行，就一定要装它。\n- **怎么做**：在终端里输入 `npm install -g pnpm`，回车等待完成即可。\n\n### 3. 准备 DeepSeek API Key（必需，约 5~10 分钟）\n\n- **这是什么**：一串\"钥匙\"，用来证明你有权限调用 DeepSeek 的 AI 模型。dsh 本身不包含 AI 大脑，它的大脑是通过这串钥匙向 DeepSeek 的云服务\"借\"来的。\n- **怎么做**：到 DeepSeek 开放平台（https://platform.deepseek.com）注册账号，创建 API Key（一串字母数字），然后把它填进电脑的\"环境变量\"里，变量名叫 `DEEPSEEK_API_KEY`（通俗理解：在电脑里存一条名为 `DEEPSEEK_API_KEY` 的记录，值就是你的钥匙）。具体填法网上搜\"Windows 设置环境变量\"或\"Mac 设置环境变量\"就有图文教程。\n- **注意**：调用 AI 模型会消耗账户额度（按使用量计费，价格很低），没有这串钥匙的话，dsh 也能启动，但 AI 不会真正工作（项目里很多测试会自动跳过）。\n\n### 4. 其他说明\n\n- **操作系统**：Windows、macOS、Linux 都可以。\n- **网络**：需要能访问 npm（下载软件）和 DeepSeek 服务（调用模型）。\n\n---\n\n## 第 3 章：快速开始\n\n最快的方式是**一条命令跑起来**，全程约 5~10 分钟（前提是第 2 章的准备工作已完成）。\n\n### 方式一：用 npm 一条命令启动（推荐新手）\n\n1. 打开终端（Windows 的命令提示符 / PowerShell，或 Mac 的终端）。\n2. 输入下面这条命令并回车：\n\n```sh\nnpx @deepseek-ai/dsh web\n```\n\n3. 第一次运行会自动下载所需文件（约 1~3 分钟，视网速而定），之后会看到类似下面的输出：\n\n```\nDeepSeek Harness is running\nWeb UI available at: http://127.0.0.1:3080\n```\n\n4. 打开浏览器，访问 **http://127.0.0.1:3080**，你就看到了 dsh 的网页界面。\n\n### 方式二：从源码运行（适合想折腾、想二次开发的人）\n\n```sh\ngit clone https://github.com/deepseek-ai/deepseek-harness.git\ncd deepseek-harness\npnpm install      # 安装依赖，约 3~10 分钟\npnpm run build    # 编译项目，约 1~5 分钟\npnpm dsh web      # 启动，同样访问 http://127.0.0.1:3080\n```\n\n### 启动后你会看到什么\n\n一个聊天界面（类似 ChatGPT 的对话框）。第一次使用，按以下两步配置：\n\n1. 打开 **设置 → 模型**，填入你的 DeepSeek API Key 并保存（配置立即生效，不用重启）。\n2. 点击 **选择工作区**，把你存放项目的文件夹加进来并选中（工作区 = 允许 AI 动手操作的那个文件夹）。\n\n然后就可以在输入框里打字了。试试输入：\n\n> 介绍一下这个文件夹里都有什么\n\nAI 会读取文件、给你一份总结——恭喜，你的第一个 AI 编程助手跑起来了！\n\n---\n\n## 第 4 章：详细使用步骤\n\ndsh 一共有**三种使用方式**，按需选择，可以混用。\n\n### 方式一：Web 网页界面（推荐日常使用）— 必需的基础操作\n\n这是最直观的方式，适合绝大多数人。\n\n| 步骤 | 操作 | 说明 |\n|------|------|------|\n| 1 | 启动服务器 | 终端运行 `npx @deepseek-ai/dsh web`（保持终端开着别关） |\n| 2 | 打开网页 | 浏览器访问 http://127.0.0.1:3080 |\n| 3 | 配置模型（必需） | 设置 → 模型 → 填入 DeepSeek API Key 并保存 |\n| 4 | 选择工作区（必需） | 添加并选中一个文件夹作为 AI 的\"工作地盘\" |\n| 5 | 开始对话（必需） | 在输入框描述你想做的事，回车发送 |\n| 6 | 处理审批请求（可选） | 当 AI 想做一些敏感操作（比如修改系统文件）时，网页会弹窗问你\"允许吗\"，你点同意或拒绝 |\n| 7 | 查看历史会话（可选） | 对话记录会被自动保存，下次打开还能接着聊 |\n\n> **注意**：网页界面只在本机生效（地址是 127.0.0.1 开头的本地地址），别人访问不到，这是安全设计。\n\n### 方式二：命令行一次性任务（headless，适合跑自动化）— 可选\n\n不想开网页，只想让 AI 干一件具体的事然后退出，用这个方式。它叫 headless（\"无头\"），意思是\"没有界面的操作\"。\n\n```sh\ndsh --profile headless \"帮我检查一下这个项目里有没有语法错误\"\n```\n\n- **必需**：提前设置好 `DEEPSEEK_API_KEY` 环境变量。\n- **预期结果**：终端里直接打印出 AI 的答复，任务结束进程退出。\n- **适合**：写脚本定时调用、服务器上跑批处理任务等不需要人盯着的场景。\n\n### 方式三：ACP 自动化服务器（给其他程序调用）— 可选\n\nACP（Agent Client Protocol，智能体客户端协议）是一个让\"程序之间对话\"的标准接口。启动后，dsh 会变成一个\"AI 服务后台\"，其他软件可以通过这个接口调用它。\n\n```sh\ndsh acp\n```\n\n- **必需**：设置好 `DEEPSEEK_API_KEY` 环境变量。\n- **预期结果**：终端显示服务已就绪，等待其他程序连接。\n- **适合**：你想把 AI 能力嵌入自己的软件、机器人或自动化流程里的时候。\n- **注意**：这是给\"程序\"用的接口，普通用户日常用不到，属于进阶功能。\n\n> **小结**：日常聊天、改代码用**方式一**；自动化批量任务用**方式二**；给程序当\"后台大脑\"用**方式三**。\n\n---\n\n## 第 5 章：项目有哪些模块\n\ndsh 由很多小模块拼成，下面是普通用户最需要了解的 8 个核心模块。\n\n### 模块 1：系统提示词（AI 的\"人设和规则\"）\n- **一句话说明**：给 AI 设定\"你是谁、说话什么风格、做事什么规矩\"的一段开场白。\n- **包含的功能**：\n  - 预设人设：默认给 AI 一套\"专业、谨慎、先验证再回答\"的编程助手性格。\n  - 自定义人设：你可以通过配置（见第 6 章 `persona`）改成任何风格，比如\"用小学生都能听懂的话解释代码\"。\n- **和其他模块的关系**：它是每次对话的\"第一句话\"，AI 的所有行为都受它约束。\n\n### 模块 2：工具集（AI 的\"手和脚\"）\n- **一句话说明**：让 AI 能真正动手做事的能力清单，包括执行命令、读写文件、搜索网页等。\n- **包含的功能**：\n  - 执行命令（bash）：AI 可以在你的电脑上运行命令，比如\"运行测试\"。\n  - 读写文件：AI 能查看、新建、修改工作区里的文件。\n  - 搜索网页：AI 能上网查资料来回答你的问题。\n- **和其他模块的关系**：工具是 AI 的\"输出器官\"；沙箱模块（模块 8）决定这些工具能用多大力气。\n\n### 模块 3：会话持久化（AI 的\"记忆\"）\n- **一句话说明**：把对话历史存到硬盘上，关掉程序再打开，聊天记录还在。\n- **包含的功能**：\n  - 自动保存：每一轮对话都会被记录。\n  - 断点续聊：重启后可以继续之前的会话，AI 还记得之前说过什么。\n- **和其他模块的关系**：它为压缩模块（模块 7）提供\"历史素材\"，压缩后的摘要也存回这里。\n\n### 模块 4：子智能体（AI 的\"分身\"）\n- **一句话说明**：让主 AI 把子任务派给\"分身\"去干，自己专心统筹。\n- **包含的功能**：\n  - 派活：任务复杂时，AI 可以开几个分身并行处理不同部分。\n  - 回收结果：分身干完活把结果交回主 AI 汇总。\n- **和其他模块的关系**：分身也使用同样的工具集和沙箱规则，不会\"越权\"。\n\n### 模块 5：工作流（多步骤任务\"流水线\"）\n- **一句话说明**：把\"先做 A、再做 B、最后做 C\"的多步任务编排成一条流水线自动跑。\n- **包含的功能**：\n  - 步骤编排：定义任务的先后顺序和依赖关系。\n  - 自动执行：一次启动，按剧本一步步走完。\n- **和其他模块的关系**：流水线里每一步都可以调用工具集，也可以派给子智能体。\n\n### 模块 6：技能（可复用的\"指令包\"）\n- **一句话说明**：把一段\"怎么做某类事\"的完整经验打包，以后随时调用。\n- **包含的功能**：\n  - 打包复用：比如\"写周报\"技能，包含写周报的全部步骤和格式要求，一次配置多次使用。\n  - 按需加载：只有用到时才把对应指令加载给 AI，节省空间。\n- **和其他模块的关系**：技能本质上是\"系统提示词\"的高级形态，按场景动态装配。\n\n### 模块 7：压缩（对话太长时的\"自动总结\"）\n- **一句话说明**：对话太长、快超出 AI 的记忆上限时，自动把早期内容总结成摘要，腾出空间。\n- **包含的功能**：\n  - 阈值触发：对话量达到 80% 上限时自动启动。\n  - 智能总结：把旧对话浓缩成要点，保留关键信息（详见第 9 章的\"KV 缓存对齐\"亮点）。\n- **和其他模块的关系**：读取会话持久化模块的旧记录，压缩后继续写入记忆。\n\n### 模块 8：沙箱（AI 的\"活动范围围栏\"）\n- **一句话说明**：限制 AI 能碰哪些文件、有多大权限，防止它搞破坏。\n- **包含的功能**：\n  - 三档权限：只读（只能看不能改）、工作区可写（只能在指定文件夹里改）、完全放行（不设限，危险）。\n  - 审批拦截：遇到权限边界时先问你\"要不要允许\"。\n- **和其他模块的关系**：它罩着工具集——AI 的每只手伸出去之前，都要先过沙箱这关。\n\n### 模块关系总览（用大白话描述）\n\n> 你（用户）向 **AI 主脑**（由系统提示词设定人设）下指令；主脑通过**工具集**动手做事，工具被**沙箱**管着；做事过程中**子智能体**帮忙打下手、**工作流**负责排顺序；聊天的每句话都存入**会话持久化**的记忆库，太长时由**压缩**模块帮忙\"翻旧账总结\"；而**技能**模块随时给主脑递上\"经验手册\"。所有模块像插头一样插在同一个底座上，这就是\"一切皆插件\"。\n\n---\n\n## 第 6 章：可以自定义的配置\n\ndsh 的核心配置文件叫 **cordis.yml**（在项目目录里，用记事本就能编辑）。大部分个性化设置都在这里改。\n\n| 配置项 | 在哪里改 | 默认值 | 改成什么会怎样 | 建议 |\n|--------|---------|--------|---------------|------|\n| `persona`（AI 人设） | cordis.yml | 官方预设编程助手人设 | 改成\"你是我的中文写作教练\"等，AI 会按新风格回答 | 按需定制，人设写得越具体，AI 越听话 |\n| `model`（模型选择） | cordis.yml 或网页\"设置→模型\" | `deepseek-v4-flash`（快） | 换成 `deepseek-v4-pro`（强）：回答质量更高但更慢、更贵 | 日常用 flash，复杂任务临时换 pro |\n| `sandbox`（文件权限档位） | cordis.yml | `read-only`（只读） | `workspace-write`（工作区内可写）、`danger-full-access`（完全放行） | 保持前两档，**不要轻易用完全放行** |\n| `thinking`（深度思考开关） | cordis.yml | `enabled`（开启） | 关闭后 AI 不\"先想后答\"，响应更快但容易答错 | 简单问题可关，复杂问题开着 |\n| `reasoningEffort`（思考投入度） | cordis.yml | `max`（最大） | 调成 `high`/`off`，AI 想得少一些、回得快一些 | 想省钱省时再调低 |\n| `DEEPSEEK_API_KEY`（API 钥匙） | 系统环境变量 | 无 | 不设置则 AI 不工作 | 必填，启动前设置好 |\n| 端口（网页访问地址） | cordis.yml 的 webserver 段 | 3080 | 改成别的数字，访问地址跟着变 | 端口被占用时才需要改 |\n\n> **推荐做法**：新手只改 `persona` 和模型两项就够了；沙箱档位、思考深度这些，等熟悉了再动。`danger-full-access` 属于\"拆掉安全围栏\"，强烈不建议。\n\n---\n\n## 第 7 章：输入输出示例\n\n下面的示例按从简单到复杂的顺序排列。示例输出为**示意**，实际内容取决于你的任务和模型。\n\n### 示例 1：让 AI 改代码（最简单）\n\n**我想做什么**：让 AI 把一个脚本里的日期格式从\"2024/01/05\"改成\"2024-01-05\"。\n\n**我输入了什么**（在 Web 网页输入框里）：\n```\n帮我把 report.js 里所有 \"2024/01/05\" 这种斜杠日期，改成 \"2024-01-05\" 这种横杠格式。\n```\n\n**项目返回了什么**（示意）：\n```\n已修改 report.js：\n- 第 12 行：2024/01/05 → 2024-01-05\n- 第 34 行：2024/01/06 → 2024-01-06\n- 第 78 行：2024/01/08 → 2024-01-08\n共修改 3 处。已检查没有其他斜杠日期遗漏。\n```\n\n**这个结果是什么意思**：AI 读懂了文件，找到了所有需要改的地方，改完还复查了一遍。你可以打开文件确认改动是否正确。\n\n### 示例 2：让 AI 跑命令\n\n**我想做什么**：让 AI 运行项目的测试并汇报结果。\n\n**我输入了什么**：\n```\n运行这个项目的测试，然后把结果总结给我。\n```\n\n**项目返回了什么**（示意）：\n```\n我运行了 `npm test`，输出如下：\n✓ 42 个测试通过\n✗ 1 个测试失败：test/tools.test.js 第 87 行\n失败原因：期望返回 3，实际返回 4。\n我查看了相关代码，可能是 getCount 函数里的边界条件写错了，要我修一下吗？\n```\n\n**这个结果是什么意思**：AI 不只执行了命令，还分析了失败原因并给出了下一步建议——这是它比普通\"脚本\"强的地方。\n\n### 示例 3：让 AI 搜索资料\n\n**我想做什么**：让 AI 上网查最新的信息。\n\n**我输入了什么**：\n```\n搜索一下 Node.js 目前最新的 LTS（长期支持）版本是哪个，什么时候发布的支持到什么时候。\n```\n\n**项目返回了什么**（示意）：\n```\n根据搜索结果：Node.js 当前最新的 LTS 版本是 v24.x（发布于 2025 年 10 月，支持到 2028 年 4 月）。\n来源：nodejs.org 官方发布页。\n注：搜索结果来自网络，建议以官方页面为准。\n```\n\n**这个结果是什么意思**：AI 真的上网查了资料并给出答案和来源。注意它会提醒你\"以官方为准\"——因为网页信息可能滞后，这是 AI 负责任的表现。\n\n---\n\n## 第 8 章：什么情况适合用 / 不适合用\n\n**适合用的场景：**\n- **场景 1：个人开发者想有个\"随叫随到的编程搭档\"**——帮你写代码、改 bug、跑测试、解释陌生代码，省去反复搜索和切换工具的时间。\n- **场景 2：自动化重复性工作**——比如每天定时让 AI 检查代码质量、生成日报、批量整理文件，用命令行方式挂到脚本里。\n- **场景 3：喜欢折腾、想自建 AI 助手的人**——想拥有自己的、可定制、数据在自己手里的 AI 助手，而不是只能用别人家的现成产品。\n- **场景 4：想把 AI 能力嵌进自己的软件**——通过 ACP 接口，把你的应用变成\"能动手干活\"的智能应用。\n\n**不适合用的场景：**\n- **场景 1：完全不想碰命令行的人**——安装和启动必须用命令行操作（虽然日常使用有网页界面，但\"启动\"这一步绕不开）。替代方案：直接用 DeepSeek 官方网页版或 ChatGPT 等现成产品。\n- **场景 2：需要稳定\"交钥匙\"服务的人**——项目处于开发者预览期，升级可能带来不兼容变化（见第 9 章），生产环境用要谨慎。替代方案：等正式版，或用成熟商业产品。\n- **场景 3：任务涉及极高敏感数据**——虽然沙箱能限制文件权限，但调用云端模型意味着数据会发送给 DeepSeek 服务。涉密场景建议先确认数据合规要求。\n- **场景 4：只需要纯聊天、不干活**——dsh 是\"动手型\"助手，纯闲聊体验不如专门的聊天产品，杀鸡不用牛刀。\n\n---\n\n## 第 9 章：优点与不足\n\n> 本章基于对项目代码的实际观察。\n\n**优点：**\n- **插件化设计，极其灵活**：每个能力都是一块可拆装的\"积木\"，想换想加都容易。这是它区别于多数同类产品的最大特色——不满足于\"能用\"，而是\"想怎么改都行\"。\n- **多智能体协作**：能派\"分身\"并行干活再汇总，复杂任务处理起来有条理、速度快。\n- **对话压缩技术讲究（KV 缓存对齐）**：对话太长时自动总结旧内容，而且压缩方式会\"对齐\" AI 的内部缓存（KV 缓存，见第 11 章），尽量让压缩后的回答速度不受影响。这个细节很多同类产品做不到。\n- **安全设计到位**：三档文件权限沙箱 + 关键操作人工审批，让\"放手让 AI 干活\"这件事变得相对安心。\n- **三种使用方式齐全**：网页界面、命令行、程序接口，从新手到开发者都能找到入口。\n\n**不足：**\n- **开发者预览期，变化快**：项目明说\"未来会有破坏兼容性的变更\"，今天能用的功能明天可能改名字或变用法，升级需谨慎。应对办法：留意官方公告，重要环境固定版本。\n- **有学习门槛**：安装启动要会敲命令行、配置要会改配置文件，对纯小白不友好。应对办法：照着本说明书做，日常使用集中在网页界面即可。\n- **文档偏技术化**：很多说明文档面向开发者撰写，非技术用户查阅时有障碍。应对办法：以本说明书和网页界面内提示为主。\n\n---\n\n## 第 10 章：常见问题与排错\n\n**Q1：安装时提示 Node.js 版本太低 / 安装失败**\n- 可能原因：Node.js 版本低于 22.19，或下载网络不稳定。\n- 解决办法：去 nodejs.org 下载最新 LTS 版本重装，装完运行 `node --version` 确认版本号 ≥ 22.19；网络问题可稍后重试，或配置 npm 国内镜像（搜索\"npm 镜像设置\"有教程）。\n\n**Q2：输入 `npx @deepseek-ai/dsh web` 提示找不到命令 / 报错**\n- 可能原因：npx 没装好（Node.js 安装不完整），或首次下载超时。\n- 解决办法：重装 Node.js；或先运行 `npm install -g @deepseek-ai/dsh` 全局安装，再直接运行 `dsh web`。\n\n**Q3：网页能打开，但发消息 AI 不回复 / 报\"API Key 无效\"**\n- 可能原因：API Key 没填、填错了、或者环境变量名不对。\n- 解决办法：到 DeepSeek 开放平台重新复制 Key，在网页\"设置→模型\"里粘贴保存；如果用命令行方式，检查环境变量 `DEEPSEEK_API_KEY` 是否设置正确（重新打开终端让环境变量生效）。\n- 注意：API Key 形如一长串字母数字，复制时别带空格。\n\n**Q4：AI 说\"没有权限\" / 写入文件失败**\n- 可能原因：沙箱处于\"只读\"档位，AI 只能看不能改。\n- 解决办法：这是**安全设计**，不是故障。想让 AI 改文件，把沙箱档位调到\"工作区可写\"，并确保要改的文件在选定的工作区文件夹内；或遇到审批弹窗时点\"允许\"。\n\n**Q5：AI 的回答不符合预期**\n- 可能原因：任务描述太模糊、模型选择不合适（默认 flash 偏快但能力弱于 pro）、人设约束不够。\n- 解决办法：把需求写具体（\"做什么、改哪个文件、做成什么样\"）；复杂任务临时切换到 `deepseek-v4-pro` 模型；在 `persona` 里补充规则（如\"改代码前先解释你的方案\"）。\n\n**Q6：端口被占用，网页打不开**\n- 可能原因：3080 端口被其他程序占用。\n- 解决办法：在 cordis.yml 的 webserver 配置里把端口改成 3081 等未占用数字，然后访问对应地址。\n\n**Q7：运行测试报错，无法启动**\n- 可能原因：依赖没装全或编译失败（源码方式运行时常见）。\n- 解决办法：回到项目目录依次执行 `pnpm install` → `pnpm run build`，看到成功提示后再 `pnpm dsh web`。\n\n---\n\n## 第 11 章：术语表\n\n| 术语 | 通俗解释 |\n|------|---------|\n| Agent（智能体） | 一个能\"理解指令并动手做事\"的 AI 程序，不只是回答问题，还会调用工具完成任务 |\n| Harness | 直译\"挽具/控制装置\"，这里指\"驱动和管理智能体的一套框架\"，dsh 就是这样一个框架 |\n| 插件（Plugin） | 一块可以插拔的功能\"积木\"，如\"读文件\"\"跑命令\"各是一块，想用就插上，不想用就拔掉 |\n| 沙箱（Sandbox） | 给 AI 画的\"活动范围围栏\"，限制它能读写哪些文件、有多大权限 |\n| Token | AI 处理文字的最小单位，大约 1 个汉字 ≈ 1~2 个 token；对话越长消耗的 token 越多，费用也越高 |\n| 系统提示词（System Prompt） | 每次对话前发给 AI 的\"开场白\"，设定它的身份、风格和规则 |\n| 多智能体（Multi-agent） | 多个 AI 协作干活：一个主智能体统筹，派\"分身\"并行处理子任务 |\n| API Key | 一串类似密码的字符，用来证明\"你是你\"并调用 AI 服务，需要保密 |\n| API | 程序之间互相\"对话\"的约定接口，可以理解为\"传话窗口\" |\n| 环境变量 | 存在操作系统里的\"全局小纸条\"，程序运行时可以读取，`DEEPSEEK_API_KEY` 就是其中一张 |\n| 命令行 / 终端 | 一个靠打字输入指令操作电脑的黑窗口，比鼠标操作更底层、更强大 |\n| CLI | 命令行工具的缩写，指\"靠打字运行的软件\" |\n| Web GUI | 网页图形界面，指在浏览器里用鼠标操作的界面，如 http://127.0.0.1:3080 |\n| ACP | Agent Client Protocol 的缩写，一种让\"程序之间调用 AI\"的标准接口 |\n| 工作流（Workflow） | 把多步任务按顺序编排好、一次自动跑完的\"流水线\" |\n| 技能（Skill） | 打包好的一整套\"做事经验\"，告诉 AI\"这类事情按这个套路做\" |\n| 会话（Session） | 一次连续的对话，从开始聊天到结束/关闭算一个会话 |\n| 会话持久化 | 把对话记录存到硬盘上，重启后还能找回历史 |\n| 压缩（Compaction） | 对话太长时自动把旧内容总结成摘要，腾出记忆空间 |\n| KV 缓存 | AI 推理时的\"草稿纸\"：模型把算过的中间结果记下来加速后续回答；KV 缓存对齐指压缩时尽量不弄乱这张草稿纸，让速度不打折 |\n| 上下文窗口（Context Window） | AI 一次能\"记住\"的最大对话量，超出就要靠压缩来腾地方 |\n| 开源 | 源代码公开免费，任何人都能看、能改、能分享 |\n| 许可证（License） | 规定\"代码怎么用才合法\"的法律条款，dsh 用的是 MIT 许可证（见第 12 章） |\n| 开发者预览（Developer Preview） | 还没正式发布、仍在快速迭代的版本，功能可能随时变化 |\n\n---\n\n## 第 12 章：许可证说明\n\nDeepSeek Harness 使用 **MIT 许可证**，这是开源界最宽松、最友好的许可证之一。用大白话解释，它意味着：\n\n- **我可以免费使用吗？** —— 可以，完全免费，没有任何使用费。\n- **我可以用在商业项目里吗？** —— 可以，你可以拿它做产品、卖钱，包括闭源的商业软件，不需要向任何人付费。\n- **我可以修改代码吗？** —— 可以，你可以随意修改、改进，甚至把它改得面目全非再发布。\n- **我需要标注原作者吗？** —— 需要，唯一的要求是：如果你分发（发布）了这个软件或它的修改版，必须在其中保留原始的版权声明和许可证文本，让大家知道它最初来自 DeepSeek AI 团队。\n\n简单说：**随便用、随便改、随便商用，只要别把\"原作者声明\"抹掉就行。** 这也是为什么它特别适合个人学习和二次开发——你不用担心法律风险，可以放心折腾。\n","01-core:boot_app-boot_harness-source_prompt_zh.md":"# 提示词翻译文档：harness:source（Harness 源码检出位置声明）\n\n## 元信息\n- 原文件位置: `packages/boot/app-boot/src/index.ts:821-829`（text 本体在第 827 行）\n- 变量名称: `harness:source`（`HARNESS_SOURCE_SECTION`，`index.ts:805`）\n- 功能模块: `@deepseek-ai/dsh-boot-app-boot` — 应用二进制（app bin）的共享引导胶水。`addHarnessSourceSection()` 在引导完成后向全局系统提示词追加一段，声明 Harness 实现代码检出目录的位置，并明确区分\"检出位置\"与\"任务工作区/当前工作目录\"。\n- 调用场景: 引导完成（`boot()` 之后的 settled context）后调用一次；例如 web-app 的 `apply()` 在 `surfaceContext` 配置开启时通过 `ctx.inject(['systemPrompt'], ...)` 调用它（`packages/bundle/web-app/src/index.ts:140-148`）。section 以 `order: -99` 注册，恰好排在 harness 身份（-100）之后、部署人格（0）之前。\n- 来源分类: 生产代码\n\n## 英文原文\n```\nThe DeepSeek Harness implementation checkout is at ${sourceRoot}. The checkout location and current working directory are separate values and may differ; never infer the working directory from this path. Use pwd to determine the current working directory. Use this checkout only to inspect or extend DSH itself.\n```\n\n## 中文翻译\n```\nDeepSeek Harness 实现代码检出目录位于 ${sourceRoot}。检出位置与当前工作目录是两个独立的值，二者可能不一致；切勿根据此路径推断工作目录。请使用 pwd 确定当前工作目录。该检出目录仅用于检查或扩展 DSH 本身。\n```\n\n## 关键参数\n- `${sourceRoot}`：Harness 检出目录的绝对路径（JS 模板字符串在注册时插值，不是提示词 `{{variable}}` 占位符）。来源：调用方传入，如 web-app 传入 `SOURCE_ROOT`（检出根目录常量）。\n- 注册条件：仅当 `ctx.get('systemPrompt')` 返回已挂载的 `systemPrompt` 服务时才注册；未挂载则返回 `undefined`（无提示词可扩充，no-op）。\n- 行为特性：section 注册在 `systemPrompt` 服务的 fiber 上，因此该插件的 dev HMR 重载会丢弃本段，直到下次 boot 重新注册（JSDoc，`index.ts:814-816`）。\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 引导完成的 ctx + `sourceRoot`（检出根目录绝对路径）。由 `addHarnessSourceSection(ctx, sourceRoot)`（`index.ts:821`）在 boot 后调用，web-app 的 `apply()`（`packages/bundle/web-app/src/index.ts:140-148`）是生产调用方之一。\n- 下游: 注册为全局 section 进入 `PromptAssembly.sections`，渲染顺序为 `harness:identity`（-100）→ `harness:source`（-99）→ `app:web-surface`（-98）→ …… → `deployment:persona`（0）。经 `renderPrompt()` 插值拼接后进入发送给模型的系统提示词。\n- 语义意图：该段向模型声明\"实现代码在哪、怎么用\"——`dsh-tool-cordis` 自引用工具集会读取并编辑这份检出（JSDoc，`index.ts:810-811`），因此模型需要知道检出路径与工作目录的区别，且只能用它检查/扩展 DSH 本身。\n\n## 相关代码上下文\n- 函数: `addHarnessSourceSection(ctx, sourceRoot)`（`index.ts:821-829`）、`boot()`（同文件引导流程）。\n- 常量: `HARNESS_SOURCE_SECTION = 'harness:source'`（`index.ts:805`）。\n- 关键代码：\n  ```ts\n  export function addHarnessSourceSection(ctx: Context, sourceRoot: string): (() => void) | undefined {\n    const systemPrompt = ctx.get('systemPrompt')\n    if (systemPrompt === undefined) return undefined\n    return systemPrompt.section({\n      name: HARNESS_SOURCE_SECTION,\n      order: -99,\n      text: `The DeepSeek Harness implementation checkout is at ${sourceRoot}. ...`,\n    })\n  }\n  ```\n","01-core:bundle_web-app_web-surface_prompt_zh.md":"# 提示词翻译文档：web-surface（Web GUI 交互界面提示词）\n\n## 元信息\n- 原文件位置: `packages/bundle/web-app/src/index.ts:95-106`（`webSurfacePrompt` 函数）\n- 变量名称: `webSurfacePrompt`（函数名）；对应 section 名为 `app:web-surface`（`index.ts:144`）\n- 功能模块: `@deepseek-ai/dsh-web-app` — Web 运行时 bundle。本提示词向模型说明\"当前会话通过 DeepSeek Harness Web GUI 与用户交互\"这一界面事实与验收边界（orientation and acceptance boundary），包括界面指向、无隐式浏览器上下文、HMR 更新契约、URL 验证与服务器启动纪律。\n- 调用场景: 每次模型推理步前，作为文本 provider 求值：`text: () => webSurfacePrompt(localWebUrl(promptCtx))`（`index.ts:146`），即每个 assembly 用当时的 Web URL 重新求值。仅当配置 `surfaceContext: true` 时注册（`index.ts:140`）。\n- 来源分类: 生产代码\n\n## 英文原文\n函数完整拼接结果（`webUrl` 为运行时求值参数）：\n\n```\nYou are interacting with the user through the DeepSeek Harness Web GUI at ${webUrl}. When the user refers to \"this page\", \"this GUI\", or \"this app\" without naming another target, they mean this GUI. The browser provides no implicit DOM, route, or screenshot context. The client-plugin HMR receiver is active, but client-plugin changes reload without a refresh only while `pnpm run dev:web` is also running from this same checkout to rebuild their bundles; verify that watcher before promising automatic updates. Every other change — the apps/web shell and plain packages — requires rebuilding the affected Web artifacts and verifying this existing URL after a page refresh. Starting another server does not update this GUI. The apps/web Vite entry builds the shell but is not a standalone application because only dsh web injects window.__DSH_BOOT__. Do not start a replacement server unless the user asks; if one is needed, use a managed background job and verify its exact URL.\n```\n\n## 中文翻译\n```\n您正在通过 DeepSeek Harness Web GUI（网址为 ${webUrl}）与用户交互。当用户提到\"此页面\"、\"此 GUI\"或\"此应用\"而未指明其他目标时，指的就是这个 GUI。浏览器不会提供隐式的 DOM、路由或截图上下文。客户端插件的 HMR 接收器处于活动状态，但客户端插件的更改只有在同一检出目录下同时运行 `pnpm run dev:web` 以重建其 bundle 时，才会无需刷新即可重载；在承诺自动更新之前，请先验证该 watcher 是否在运行。所有其他更改——apps/web shell 与普通包——都需要重建受影响的 Web 构建产物，并在页面刷新后验证此现有 URL。启动另一个服务器并不会更新此 GUI。apps/web 的 Vite 入口会构建 shell，但它不是独立的应用程序，因为只有 dsh web 才会注入 window.__DSH_BOOT__。除非用户要求，否则不要启动替代服务器；如果确实需要，请使用受管的后台任务，并验证其确切 URL。\n```\n\n## 关键参数\n- `${webUrl}`：本 GUI 的规范回环 URL（`http://127.0.0.1:<port>`），每次 assembly 由 `localWebUrl(ctx)`（`index.ts:109-113`）从 `webServer` 服务的 `port` 解析（JS 模板字符串插值，非 `{{variable}}` 提示词占位符）。\n- 注册条件：配置 `surfaceContext`（默认值见 `apply()`，`index.ts:140` 起）为 `true`；且依赖 `systemPrompt` 服务注入。\n- 固定标识符保持原样：`window.__DSH_BOOT__`、`pnpm run dev:web`、`dsh web`、GUI 等不翻译。\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: `apply()`（`index.ts:135`）在 `surfaceContext` 开启时 `ctx.inject(['systemPrompt'], ...)`（`index.ts:141-148`），先调用 `addHarnessSourceSection` 注册 `harness:source`，再以 `text: () => webSurfacePrompt(localWebUrl(promptCtx))` 注册 `app:web-surface`。`webUrl` 每个 assembly 实时取自 `webServer` 服务端口。\n- 下游: 注册为全局 section（`order: -98`）进入 `PromptAssembly.sections`，渲染顺序为 `harness:identity`（-100）→ `harness:source`（-99）→ `app:web-surface`（-98）→ …… → `deployment:persona`（0）。经 `renderPrompt()` 插值拼接后进入发送给模型的系统提示词。\n- 语义意图：该段是\"模型视角的界面契约\"（Model-visible boundary）——告知模型当前交互通道是 Web GUI、浏览器不提供 DOM/路由/截图上下文（模型必须通过工具而非臆测来感知页面），并约束模型不得擅自启动替代服务器、不得在未验证 watcher 的情况下承诺 HMR 自动更新。\n\n## 相关代码上下文\n- 函数: `webSurfacePrompt(webUrl)`（`index.ts:95-106`）、`localWebUrl(ctx)`（`index.ts:109`）、`apply(ctx, config)`（`index.ts:135`）、`resolveLanTrust`（`index.ts:85`）。\n- 注册代码：\n  ```ts\n  promptCtx.systemPrompt.section({\n    name: 'app:web-surface',\n    order: -98,\n    text: () => webSurfacePrompt(localWebUrl(promptCtx)),\n  })\n  ```\n- 常量: `DSH_WEB_URL = 'DSH_WEB_URL'`（`index.ts:67`，环境变量名，shellEnv 注册的配套变量）、`LOOPBACK_HOST = '127.0.0.1'`（`index.ts:71`）。\n","01-core:core_system-prompt_deployment-persona_prompt_zh.md":"# 提示词翻译文档：deployment:persona（部署人格模板槽）\n\n## 元信息\n- 原文件位置: `packages/core/system-prompt/src/index.ts:364-369`（注册代码）；语义契约 JSDoc 在 `index.ts:191-195`；常量定义在 `index.ts:128`（`PERSONA_SECTION`）与 `index.ts:131`（`PERSONA_ORDER`）\n- 变量名称: `deployment:persona`（`PERSONA_SECTION`，`SystemPrompt` 构造函数内注册的 section 名）\n- 功能模块: `@deepseek-ai/dsh-system-prompt` — 系统提示词注册中心。本 section 是「部署人格」模板槽：文本内容完全来自部署配置 `config.persona`，默认空字符串，代码本身不提供任何预设文本。\n- 调用场景: 每次模型推理步前经 `SystemPrompt.assemble()` 收集并按 `order: 0` 参与排序，渲染进系统提示词。`order: 0` 是 `PERSONA_ORDER`，在 section 约定中表示\"模型读到的第一个 section\"（所有负数 order 的 harness 自带 section 都渲染在它之前）。人格为空时被 `renderPrompt()` 过滤，不占任何 token。\n- 来源分类: 生产代码\n\n## 英文原文\n本 section 的 text 是运行时槽位，英文原文即其语义契约（JSDoc，`index.ts:191-195`）与注册代码（`index.ts:364-369`）：\n\n```ts\n/**\n * Deployment-wide order-0 persona template. A scoped section named\n * `deployment:persona` shadows it; `{{variable}}` references are strict.\n */\npersona?: string\n```\n\n```ts\nthis.section({\n  name: PERSONA_SECTION,\n  order: PERSONA_ORDER,\n  // The fallback narrows the optional input type; the schema already defaults it.\n  text: config.persona ?? '',\n})\n```\n\n当部署方在 cordis.yml 中配置了 `persona` 时，模型实际读到的渲染文本即该配置值本身（可含 `{{variable}}` 引用）；未配置时 section 文本为空、不参与渲染。\n\n## 中文翻译\n语义契约翻译：\n```ts\n/**\n * 部署级 order-0 人格模板。名为 `deployment:persona` 的作用域 section 会遮蔽它；\n * `{{variable}}` 引用为严格模式（未知/畸形引用会抛错）。\n */\npersona?: string\n```\n\n注册逻辑翻译：\n```ts\nthis.section({\n  name: PERSONA_SECTION,       // 'deployment:persona'\n  order: PERSONA_ORDER,        // 0\n  text: config.persona ?? '',  // 回退分支仅收窄可选输入类型；schema 已将其默认为 ''\n})\n```\n\n## 关键参数\n- `config.persona`（`string`，schema 默认 `''`）：部署方在插件配置中写入的人格模板，是本节唯一文本来源。\n- `{{variable}}` 引用：允许出现在人格文本中，渲染时由 `renderPrompt()`/`interpolate()` 做严格插值——未知变量名、畸形引用（`{{}}`、含非法字符）、已注册但无值的变量均抛错（见 `index.ts:258-295`）。\n- 遮蔽机制（shadowing）：作用域（scope）内注册的同名 `deployment:persona` section 会遮蔽全局的部署人格；agent preset 即借此用自己的 section 替换部署人格（见 `PERSONA_SECTION` 的导出注释，`index.ts:122-128`）。\n\n## Few-shot 示例\n无（本 section 是模板槽，示例与否完全由部署方在 `config.persona` 中决定）\n\n## 提示词链路\n- 上游: 部署配置 `config.persona`（cordis.yml 中 `systemPrompt.persona`），默认 `''`；`{{variable}}` 的值来自 `SystemPrompt.variable()` 注册的变量 provider。同名的作用域 section（如 agent preset）可整体遮蔽它。\n- 下游: 进入 `PromptAssembly.sections`，按 `order` 升序渲染进系统提示词。渲染顺序：`harness:identity`（-100）→ `harness:source`（-99）→ `app:web-surface`（-98）→ …… → `deployment:persona`（0）→ 工具指引（100–199）。人格为空字符串时被 `renderPrompt()` 的空段过滤逻辑丢弃。\n\n## 相关代码上下文\n- 函数: `SystemPrompt` 构造函数（`index.ts:353`）、`SystemPrompt.section()`（`index.ts:381`）、`renderPrompt()`（`index.ts:212`）。\n- 常量: `PERSONA_SECTION = 'deployment:persona'`（`index.ts:128`）、`PERSONA_ORDER = 0`（`index.ts:131`）。\n- 配置 schema（`index.ts:339-345`）：`persona: z.string().default('')`。\n- 说明：本提示词\"原文为模板槽，无固定英文正文\"——其可翻译内容即上述 JSDoc 语义契约与注册代码，已在上文给出英中对照。\n","01-core:core_system-prompt_harness-identity_prompt_zh.md":"# 提示词翻译文档：harness:identity（Harness 身份声明）\n\n## 元信息\n- 原文件位置: `packages/core/system-prompt/src/index.ts:357-363`（text 本体在第 361 行）\n- 变量名称: `harness:identity`（`SystemPrompt` 构造函数内 `this.section({ ... })` 注册的 section 名）\n- 功能模块: `@deepseek-ai/dsh-system-prompt` — 系统提示词注册中心（System Prompt Registry）。本 section 是 Harness 身份声明，系统提示词的第一段、`-100` 序的开场白。\n- 调用场景: 每次模型推理步（model step）前，`SystemPrompt.assemble()` 收集全局与作用域内的 section，本 section 以 `order: -100` 参与排序；组装后经 `renderPrompt()` 插值、过滤空段、以空行拼接，作为系统提示词发送给模型。默认启用（`includeHarnessIdentity` 默认 `true`）。\n- 来源分类: 生产代码\n\n## 英文原文\n```\nYou are an AI agent powered by DeepSeek Harness.\n```\n\n## 中文翻译\n```\n你是一个由 DeepSeek Harness 驱动的 AI 智能体。\n```\n\n## 关键参数\n- 无占位符。注册条件由配置项 `includeHarnessIdentity`（`boolean`，默认 `true`）控制：\n  - `true`（默认）：注册本 section，作为系统提示词的第一段；\n  - `false`：跳过注册，系统提示词不含身份声明。\n- 相关常量：`order: -100`（本 section 的排序值，在 `PromptSection.order` 的约定中 `-100` 即 \"harness identity\"）。\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: `SystemPrompt` 构造函数（`packages/core/system-prompt/src/index.ts:353-363`）。由配置 `includeHarnessIdentity` 决定是否注册；文本为静态字符串，不依赖 `AssembleContext`。\n- 下游: 进入 `PromptAssembly.sections`，按 `order` 升序排序后由 `renderPrompt()` 渲染（`{{variable}}` 插值 → 过滤空段 → `'\\n\\n'` 拼接），作为系统提示词的开场段发给模型。`system-prompt/assemble` waterfall 可对其整体做权威替换；若存在 `complete` section，组装后仅保留该 complete section。\n\n## 相关代码上下文\n- 函数: `SystemPrompt` 构造函数（`index.ts:353`）、`SystemPrompt.section()`（`index.ts:381`）、`renderPrompt()`（`index.ts:212`）。\n- 注册代码：\n  ```ts\n  if (config.includeHarnessIdentity ?? true) {\n    this.section({\n      name: 'harness:identity',\n      order: -100,\n      text: 'You are an AI agent powered by DeepSeek Harness.',\n    })\n  }\n  ```\n- 排序约定（`PromptSection.order` 的 JSDoc，`index.ts:56-61`）：section 按 `order` 升序拼接，`-100` 为 harness 身份、`0` 为部署人格、工具指引使用 100–199；其他负数 order 也渲染在人格之前。\n","01-core:core_system-prompt_runtime-context-envelope_prompt_zh.md":"# 提示词翻译文档：runtime-context 信封（运行时上下文快照声明）\n\n## 元信息\n- 原文件位置: `packages/core/system-prompt/src/index.ts:236-240`（`joinContextSections` 函数的固定前缀）\n- 变量名称: 无命名常量；函数 `joinContextSections`，前缀文本即本提示词本体\n- 功能模块: `@deepseek-ai/dsh-system-prompt` — 动态运行时上下文（dynamic runtime context）快照的信封（envelope）。动态上下文由各子系统通过 `SystemPrompt.context()` 注册，组装后以\"user 角色的持久快照\"写入模型历史。\n- 调用场景: 每次模型推理步前，`SystemPrompt.assemble()` 收集上下文贡献（按 `order` 升序、可被 `suppressRuntimeContext()`/`includeRuntimeContext` 抑制），`renderContextSnapshot()` → `joinContextSections()` 把各段以空行拼接，并在最前面冠以本声明段。整份快照随后作为持久化的 user-role 快照注入模型历史。\n- 来源分类: 生产代码\n\n## 英文原文\n固定前缀（`index.ts:239`）：\n```\nCurrent runtime context. This snapshot supersedes earlier runtime-context snapshots.\n```\n\n完整输出结构（`index.ts:236-240`）：\n```\nCurrent runtime context. This snapshot supersedes earlier runtime-context snapshots.\n\n{body}\n```\n其中 `{body}` 是各上下文段（`ContextSnapshotSection[].text`）以 `'\\n\\n'` 拼接的结果；当 body 为空时整个函数返回 `''`（不发任何快照）。\n\n## 中文翻译\n```\n当前运行时上下文。此快照取代更早的运行时上下文快照。\n```\n\n## 关键参数\n- 无 `{{variable}}` 占位符。\n- `sections: readonly ContextSnapshotSection[]`：输入参数，每项含 `name`（贡献子系统名）与 `text`（已解析文本）。仅渲染为非空文本的段才会出现在数组中（`renderContextSections` 已过滤）。\n- 行为参数：`body` 为空 → 返回 `''`，不产出信封；否则返回前缀 + 空行 + body。\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: `renderContextSections(assembly)`（`index.ts:251-255`）产出非空上下文段列表；其输入是 `SystemPrompt.assemble()` 收集的 `PromptAssembly.contexts`（作用域合并 + 按 order 排序 + 运行时上下文抑制检查）。抑制途径：`suppressRuntimeContext()`（作用域级）或配置 `includeRuntimeContext: false`（全局）。\n- 下游: `renderContextSnapshot(assembly)`（`index.ts:224-226`）调用本函数，把完整快照字符串作为动态上下文注入模型历史。按 `PromptContext` 的 JSDoc（`index.ts:77-85`），该快照\"物化为持久化的 user 角色快照\"——信封中的\"取代更早快照\"即告诉模型：只以最新一份运行时上下文为准，旧快照失效，从而避免多轮对话中上下文累积冲突。\n\n## 相关代码上下文\n- 函数: `joinContextSections`（`index.ts:236`）、`renderContextSnapshot`（`index.ts:224`）、`renderContextSections`（`index.ts:251`）、`interpolate`（`index.ts:258`）。\n- 关键代码：\n  ```ts\n  export function joinContextSections(sections: readonly ContextSnapshotSection[]): string {\n    const body = sections.map(section => section.text).join('\\n\\n')\n    if (body.length === 0) return ''\n    return `Current runtime context. This snapshot supersedes earlier runtime-context snapshots.\\n\\n${body}`\n  }\n  ```\n- 本函数同时服务\"需要保留每段归属\"的消费方：它们用 `renderContextSections` 拿到带 `name` 的段列表自行呈现，避免重新拆分拼接后的正文（JSDoc，`index.ts:242-250`）。\n","02-tools:client_ui-deliverables_file-reference_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/client/ui-deliverables/src/index.ts:15-16`（注册处：第 22-27 行）\n- 变量名称: `FILE_REFERENCE_PROMPT`\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——最终回复中的文件引用渲染约定（与浏览器端渲染器配对的模型指导）\n- 调用场景: 插件 `apply` 阶段作为 section `ui:deliverable-file-references` 注册到系统提示词；常驻模型上下文，指导模型在成功创建/修改文件后于最终回复中提及主要输出，并按规定格式（Markdown 行内代码）让文件引用在 Web 界面可点击\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nWhen you successfully create or modify files, mention the primary outputs in your final response. To make those and any other changed-file references clickable in Web, format them as Markdown inline code using the exact file-tool path, or a basename when unique among the files changed in that turn.\n```\n\n## 中文翻译\n```text\n当你成功创建或修改文件时，请在最终回复中提及主要输出。为了让这些引用以及其他更改文件的引用在 Web 中可点击，请使用确切的文件工具路径将它们格式化为 Markdown 行内代码；当基名在该轮更改的文件中唯一时，也可以使用基名。\n```\n\n## 关键参数\n- 无模板占位符；指导中的两个格式约定为：\n  - `Markdown inline code`：Markdown 行内代码格式（反引号包裹）\n  - `exact file-tool path`：确切的文件工具路径（如 `fs_tool-fs_tool-read_prompt_zh.md` 这类由文件工具返回的路径）\n  - `basename`：文件名基名，仅当在该轮更改的文件中唯一时使用\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `ui-deliverables` 插件的 `apply(ctx)` 函数通过 `ctx.systemPrompt.section({ name: 'ui:deliverable-file-references', order: 190, text: FILE_REFERENCE_PROMPT })` 静态注册（第 22-27 行），无运行时输入\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型据此在最终回复中输出可被浏览器端渲染器识别为文件引用的行内代码\n- Section 注册: `name: 'ui:deliverable-file-references'`，`order: 190`（位于 100-199 工具指导带内、接近带尾，属于 UI 交付物 section，不指导具体工具而是指导最终回复格式）\n\n## 相关代码上下文\n`FILE_REFERENCE_PROMPT` 是 `packages/client/ui-deliverables/src/index.ts` 的模块内常量（第 15-16 行，通过字符串拼接两段构成），注释说明它是 \"Stable final-response guidance owned by the matching renderer.\"（由匹配的渲染器拥有的稳定最终回复指导）。该插件是 node 半区（node half），注册响应格式指导让浏览器半区（browser half，通过 `exports[\"./client\"]` 与 package.json 的 `dsh.client` 声明交付）能识别最终回复中的文件引用并渲染为可点击链接。插件仅注入 `systemPrompt` 服务。\n","02-tools:core_tools_code-only-instruction_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/core/tools/src/index.ts:58`（注册处：第 855-863 行 `collapseSection()`）\n- 变量名称: `CODE_ONLY_INSTRUCTION`\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——Code Mode（代码模式）下的工具调用坍缩规则声明\n- 调用场景: 在 Code Mode 生效的作用域（`modeFor(scope) === 'code'`）注册为 section `tools:code-only`；模型在 Code Mode 下只能直接调用 `run_code`，此提示词在模型读到各工具指导（100-199 带）之前先声明该规则，避免模型发出原生工具调用而收到 `UNKNOWN_TOOL`\n- 来源分类: 生产代码\n\n## 英文原文\n```text\n`run_code` is the only tool you can call directly — a tool call naming any other tool fails. Reach every tool the SDK declares below from inside the program.\n```\n\n## 中文翻译\n```text\n`run_code` 是你唯一可以直接调用的工具——命名任何其他工具的工具调用都会失败。请从程序内部调用下面 SDK 声明的每一个工具。\n```\n\n## 关键参数\n- `${RUN_CODE_NAME}`：代码拼接占位符（非模型可见），值为 `'run_code'`（定义于 `code-mode.ts:20`）；提示词实际渲染时插值为 `` `run_code` ``\n- `SDK`：下文渲染的 `tools:sdk` section 中声明的工具集（由 `sdkSchemas` 按调用作用域的可见工具生成）\n- 提示词本身无其他模板占位符\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `dsh-tools` 的 `collapseSection()` 私有方法生成 section 注册（`{ name: 'tools:code-only', order: COLLAPSE_SECTION_ORDER, text: context => this.modeFor(context.scope) === 'code' ? CODE_ONLY_INSTRUCTION : '' }`，第 855-863 行）；文本渲染函数与执行器拒绝工具调用所用的谓词完全相同（\"The SAME predicate the executor denies by\"）\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型在 Code Mode 下据此只调用 `run_code`，其他工具从程序内部通过 SDK 调用\n- Section 注册: `name: 'tools:code-only'`，`order: 99`（`COLLAPSE_SECTION_ORDER`，位于 100-199 工具指导带**之前**，即 person 段之后、各工具指导之前）；在 `both` 模式下渲染为空（原生调用在该模式下可执行，规则不成立）；指导的工具为 `run_code`（Code Mode 呈现传输通道）\n\n## 相关代码上下文\n`CODE_ONLY_INSTRUCTION`（`packages/core/tools/src/index.ts:58`）是模板字符串常量，注释说明：一条模型只能通过「被拒绝」才能发现的规则，是它纠正得太晚的规则，因此要在提示词中直接命名后果（调用失败）与出路（在程序内部调用）。`collapseSection()` 与 `sdkSection()` 注册于同一位置（第 835 行附近），后者为 `tools:sdk`（`order: 150`）。执行器侧：`run_code` 名称保留（第 1054-1055 行注册时报错），`tools.restrict()` 不能点名 `run_code`（第 1085-1086 行），Code Mode 下 `name !== RUN_CODE_NAME` 的工具调用被拒绝并提示 \"only \\`run_code\\` is callable directly — call \\`{name}\\` from inside a \\`run_code\\` program instead\"（第 1441 行）。\n","02-tools:core_tools_sdk-instructions-py_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/core/tools/src/py-types.ts:734-743`\n- 变量名称: `SDK_INSTRUCTIONS`（Python 风味）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——Code Mode 的 Python SDK 使用契约（`tools:sdk` section 的固定头部说明）\n- 调用场景: `runtime.language === 'python'` 时，`renderToolsSdkPy` 将 `SDK_INSTRUCTIONS` 与生成的 `TypedDict`/`Tools` 协议声明拼接，作为 `tools:sdk` section 渲染进系统提示词；模型在 Code Mode 下按此契约用 Python 编写 `run_code` 程序\n- 来源分类: 生产代码\n\n## 英文原文\n```text\n## Writing code for run_code\n\n`run_code` takes two required arguments: `code` — the body of an async Python function (top-level `await` and `return` both work) — and `description`, a short summary of what the program does. At run time exactly two of the names declared below are bound: `tools` and `ToolCallError`. Everything else is a STATIC STUB describing argument and return types — in particular the `TypedDict` classes do NOT exist at run time, so build arguments as plain `dict`/`list` JSON values: `await tools.name({\"field\": 1})`, never `FooArgs(field=1)`, which raises `NameError`. Inside the program:\n\n- Call tools as `await tools.name(args)` — subscript access for exotic, reserved, or underscore-leading names: `await tools[\"my-tool\"](args)`. Every call resolves to the tool's typed canonical JSON value (each method's return type below). Tool arguments must be lossless JSON.\n- A FAILED tool call raises `ToolCallError`, whose `toolName` identifies the failed tool and whose message is human-readable — wrap in `try/except` to handle and continue.\n- Independent read-only calls MAY overlap under `asyncio.gather` (safe calls run concurrently; mutating calls run alone, in submission order). Sequence dependent work with `await`.\n- Emit the run's answer with `print(...)` and/or a top-level `return <value>`; the returned value must be lossless JSON. ONLY what you print and the returned value come back — intermediate tool results never enter the conversation, so extract just what you need.\n\nThe available tools:\n```\n\n## 中文翻译\n```text\n## 为 run_code 编写代码\n\n`run_code` 接受两个必填参数：`code`——一个异步 Python 函数体（顶层 `await` 和 `return` 都可用）——以及 `description`，对程序功能的简短总结。运行时，下面声明的名称中恰好有两个被绑定：`tools` 和 `ToolCallError`。其他一切都是描述参数和返回类型的静态桩（STATIC STUB）——特别是 `TypedDict` 类在运行时并不存在，因此请以纯 `dict`/`list` JSON 值构造参数：`await tools.name({\"field\": 1})`，绝不要 `FooArgs(field=1)`，那会抛出 `NameError`。在程序内部：\n\n- 以 `await tools.name(args)` 的形式调用工具——对特殊、保留或以 `_` 开头的名称使用下标访问：`await tools[\"my-tool\"](args)`。每次调用都会解析为该工具类型化的规范 JSON 值（即下方每个方法的返回类型）。工具参数必须是无损 JSON。\n- 失败的调用会抛出 `ToolCallError`，其 `toolName` 标识失败的工具，`message` 为人类可读信息——用 `try/except` 包裹以处理并继续。\n- 相互独立的只读调用可以在 `asyncio.gather` 下重叠执行（安全调用并发运行；变更类调用按提交顺序单独运行）。有依赖关系的工作用 `await` 串行化。\n- 用 `print(...)` 和/或顶层 `return <value>` 输出本次运行的答案；返回值必须是无损 JSON。只有你打印的内容和返回值会回到你这里——中间的工具结果永远不会进入对话，因此只提取你需要的部分。\n\n可用的工具如下：\n```\n\n## 关键参数\n- `code`：异步 Python 函数体（顶层 `await`/`return` 均可用）\n- `description`：程序功能的简短总结\n- `tools` / `ToolCallError`：运行时恰好绑定的两个名称\n- `TypedDict`：声明中仅作静态桩的类，运行时不存在；参数必须以纯 `dict`/`list` JSON 值构造（`await tools.name({\"field\": 1})`），调用 `FooArgs(field=1)` 会抛 `NameError`\n- `tools.name(args)` / `await tools[\"my-tool\"](args)`：工具调用语法（普通调用 / 对特殊、保留、`_` 开头名称的下标访问）\n- `asyncio.gather`：独立只读调用可重叠执行的并发机制（安全调用并发、变更调用按提交顺序串行）\n- `print(...)` / 顶层 `return <value>`：结果输出方式，仅打印内容与返回值会回到模型\n- 生成的 `TypedDict` 类、`Tools` 协议与 `tools: Tools` 单例（`renderToolsSdkPy` 输出）接在 \"The available tools:\" 之后\n\n## Few-shot 示例\n无（`await tools.name({\"field\": 1})`、`FooArgs(field=1)` 等为反例/语法示例，非完整 Few-shot 演示）\n\n## 提示词链路\n- 上游: 常量由 `renderToolsSdkPy(schemas, outputs)` 消费——先输出 `SDK_INSTRUCTIONS`，再按字典序生成每个工具的 `TypedDict` 类（嵌套类先于引用它的父类）与 `Tools` 协议方法，最终返回 `${SDK_INSTRUCTIONS}\\n\\n\\`\\`\\`python\\n${declaration}\\n\\`\\`\\``（第 817 行）；调用方为 `dsh-tools` 的 `sdkSection()`（`index.ts:875`），按调用作用域的可见工具（排除 `run_code` 自身）生成\n- 下游: 作为 `tools:sdk` section 渲染进最终系统提示词；模型据此编写 `run_code` 程序并在程序内调用各 SDK 工具\n- Section 注册: `name: 'tools:sdk'`，`order: 150`（`SDK_SECTION_ORDER`，位于 100-199 工具指导带内、各工具指导之后）；`renderToolsSdkPy` 由 `SDK_RENDERERS.python` 指向（`index.ts:62`）\n\n## 相关代码上下文\n`SDK_INSTRUCTIONS` 定义于 `packages/core/tools/src/py-types.ts:734-743`，注释为 \"The fixed model-facing usage contract rendered above the declarations.\"（渲染在声明之上的固定模型可见使用契约）。`jsonSchemaToPy`（第 726-731 行）把统一 schema 映射为 Python 类型表达式：`object` 退化为 `dict[str, Any]`（命名 TypedDict 需要 `renderToolsSdkPy` 提供的渲染上下文）、`const`/`enum` → `Literal[...]`、`oneOf` → 联合、`array` → `list[T]`，不支持/畸形输入回退为 `Any`；类型注解仅作参考，Python 运行时不强制。与 TS 风味（`ts-types.ts`）并行，两者均强调无损 JSON 参数与「只有打印/返回的内容回到对话」。\n","02-tools:core_tools_sdk-instructions-ts_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/core/tools/src/ts-types.ts:250-259`\n- 变量名称: `SDK_INSTRUCTIONS`（TypeScript 风味）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——Code Mode 的 TypeScript SDK 使用契约（`tools:sdk` section 的固定头部说明）\n- 调用场景: `runtime.language === 'typescript'` 时，`renderToolsSdk` 将 `SDK_INSTRUCTIONS` 与生成的 `declare const tools` 接口拼接，作为 `tools:sdk` section 渲染进系统提示词；模型在 Code Mode 下按此契约用 TypeScript 编写 `run_code` 程序\n- 来源分类: 生产代码\n\n## 英文原文\n```text\n## Writing code for run_code\n\n`run_code` takes two required arguments: `code` — the body of an async TypeScript function (erasable syntax only — no `enum` or namespaces; type annotations are advisory, the code runs type-stripped) — and `description`, a short summary of what the program does. Inside the program:\n\n- Call tools as `await tools.name(args)` — quoted access for exotic names: `tools[\"my-tool\"](args)`. Every call resolves to the tool's typed canonical JSON value. Tool arguments must be lossless JSON.\n- A FAILED tool call rejects with `ToolCallError`, whose `toolName` identifies the failed tool and whose `message` is human-readable — `try/catch` it to handle and continue.\n- Independent read-only calls MAY overlap under `Promise.all` (safe calls run concurrently; mutating calls run alone, in submission order). Sequence dependent work with `await`.\n- Emit results with `return` and/or `console.log(...)`. ONLY what you print or return comes back to you — intermediate tool results never enter the conversation, so extract just what you need.\n\nThe available tools:\n```\n\n## 中文翻译\n```text\n## 为 run_code 编写代码\n\n`run_code` 接受两个必填参数：`code`——一个异步 TypeScript 函数体（仅限可擦除语法——不允许 `enum` 或命名空间；类型注解仅供参考，代码运行时会被剥离类型）——以及 `description`，对程序功能的简短总结。在程序内部：\n\n- 以 `await tools.name(args)` 的形式调用工具——对特殊名称使用带引号的访问：`tools[\"my-tool\"](args)`。每次调用都会解析为该工具类型化的规范 JSON 值。工具参数必须是无损 JSON。\n- 失败的调用会以 `ToolCallError` 拒绝，其 `toolName` 标识失败的工具，`message` 为人类可读信息——用 `try/catch` 捕获以处理并继续。\n- 相互独立的只读调用可以在 `Promise.all` 下重叠执行（安全调用并发运行；变更类调用按提交顺序单独运行）。有依赖关系的工作用 `await` 串行化。\n- 用 `return` 和/或 `console.log(...)` 输出结果。只有你打印或返回的内容才会回到你这里——中间的工具结果永远不会进入对话，因此只提取你需要的部分。\n\n可用的工具如下：\n```\n\n## 关键参数\n- `code`：异步 TypeScript 函数体（仅可擦除语法：无 `enum`/命名空间；类型注解仅作参考，运行时剥离类型）\n- `description`：程序功能的简短总结\n- `tools.name(args)` / `tools[\"my-tool\"](args)`：工具调用语法（普通点访问 / 特殊名称带引号访问），每个调用解析为工具类型化的规范 JSON 值\n- `ToolCallError`：失败调用拒绝时抛出的错误，含 `toolName`（失败工具标识）与 `message`（人类可读信息）\n- `Promise.all`：独立只读调用可重叠执行的并发机制（安全调用并发、变更调用按提交顺序串行）\n- `return` / `console.log(...)`：结果输出方式，仅打印/返回内容会回到模型\n- 生成的 `declare const tools` 接口（`renderToolsSdk` 按工具名字典序输出）接在 \"The available tools:\" 之后\n\n## Few-shot 示例\n无（`code` 参数描述中的 `await tools.name(args)`、`tools[\"my-tool\"](args)` 等为语法示例，非完整 Few-shot 演示）\n\n## 提示词链路\n- 上游: 常量由 `renderToolsSdk(schemas)`（`ts-types.ts:273`）消费——先输出 `SDK_INSTRUCTIONS`，再按字典序生成每个工具的 `args`/`output` 类型成员，最终返回 `${SDK_INSTRUCTIONS}\\n\\n\\`\\`\\`ts\\n${jsonValue}\\n\\n${declaration}\\n\\`\\`\\``（第 292 行）；调用方为 `dsh-tools` 的 `sdkSection()`（`index.ts:875`），按调用作用域的可见工具（排除 `run_code` 自身）生成\n- 下游: 作为 `tools:sdk` section 渲染进最终系统提示词；模型据此编写 `run_code` 程序并在程序内调用各 SDK 工具\n- Section 注册: `name: 'tools:sdk'`，`order: 150`（`SDK_SECTION_ORDER`，位于 100-199 工具指导带内、各工具指导之后）；`renderToolsSdk` 由 `SDK_RENDERERS.typescript` 指向（`index.ts:61`）\n\n## 相关代码上下文\n`SDK_INSTRUCTIONS` 定义于 `packages/core/tools/src/ts-types.ts:250-259`，注释说明其为渲染在声明之上的固定模型可见使用契约（\"The fixed model-facing usage contract rendered above the declarations (see the Code Mode Agent Note's 'What the model sees')\"）。渲染确定性保证：工具按名字典序输出，未变化的工具集会生成字节级一致的文本。`renderToolsSdk` 调用 `jsonSchemaToTs` 把统一 schema 映射为 TS 类型字面量（不支持/畸形输入回退为 `unknown`）。\n","02-tools:fs_tool-fs-search_tool-glob_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/fs/tool-fs-search/src/glob.ts:301-306`\n- 变量名称: 无（`ctx.systemPrompt.section({...})` 内联文本，section name 为 `tool:glob`；文本尾部拼接 `overCapGuidance` 变量）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——文件路径发现工具 `glob`\n- 调用场景: 插件 `apply` 阶段注册到系统提示词；常驻模型上下文，指导模型用 `glob` 工具（而非 shell 的 find）按路径模式发现文件，并理解无 `/` 模式的匹配语义与超限结果的返回方式\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nUse the glob tool — not shell find — to discover files by path pattern. A pattern with no \"/\" matches basenames at any depth, so \"*\" matches every file in the tree rather than its top level. Results are files only, never directories, and include hidden and ignored files: a result that fits comes back in modification-time order, while a larger one keeps the modification-time-ordered head.\n```\n\n> 注：末尾一句随配置 `sampleOverCapGlobResults` 有两种变体。默认（`false`）为上方 `...keeps the modification-time-ordered head.`；开启抽样时（`true`）替换为 `...is sampled across top-level entries, so it spans the tree instead of one subtree.`\n\n## 中文翻译\n```text\n使用 glob 工具（而不是 shell 的 find）按路径模式发现文件。不含 \"/\" 的模式会匹配任意深度的基名，因此 \"*\" 会匹配树中的所有文件，而不仅仅是顶层。结果只包含文件，绝不包含目录，并且包括隐藏和被忽略的文件：能放得下的结果按修改时间顺序返回，而更大的结果则保留修改时间排序的头部。\n```\n\n> 抽样变体（`sampleOverCapGlobResults: true`）：末尾句译为「而更大的结果会在顶层条目中抽样，使其横跨整棵树而不是单个子树。」\n\n## 关键参数\n- `pattern`：用于匹配文件路径的 glob 模式（如 `\"**/*.ts\"`、`\"src/**/*.test.js\"`）；不含 `/` 的模式按基名在任意深度匹配，含 `/` 可锚定深度\n- `path`：要搜索的目录；默认是会话工作区，相对路径按工作区解析\n- `maxResults`（配置 `caps.maxResults`）：按修改时间顺序返回的路径数上限\n- `sampleOverCapGlobResults`（配置开关）：决定超限时是「保留修改时间排序的头部」（默认）还是「在顶层条目中抽样」\n- 提示词本身无模板占位符（`overCapGuidance` 为代码拼接变量，非模型可见占位符）\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-fs-search` 的 `applyGlobTool(ctx, caps)` 函数通过 `ctx.systemPrompt.section()` 静态注册（第 301-306 行），`caps` 为部署解析后的 glob 上限配置；`overCapGuidance`（第 298-300 行）按 `caps.sampleOverCapGlobResults` 选择文案\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型发现文件路径时遵循此指导\n- Section 注册: `name: 'tool:glob'`，`order: 103`（位于 100-199 工具指导带内，紧随 `tool:edit` 之后），指导的工具为 `glob`\n\n## 相关代码上下文\n`applyGlobTool(ctx: Context, caps: GlobToolCaps)`（`packages/fs/tool-fs-search/src/glob.ts:297`）注册提示词后调用 `ctx.tools.register(defineTool({ name: 'glob', ... }))`，执行使用 `subprocess` 服务。工具 description 与提示词语义一致：\"Find files whose paths match a glob pattern. Returns matching file paths — never directories — including hidden and ignored files (VCS metadata directories are excluded)...\"。输出 schema 含 `root` 与 `paths` 数组，由 `renderGlobPaths` 渲染为文本，并通过 `presentGlobResult` 投影为搜索卡片视图（`SearchResultView`，shape 为 `paths`）。\n","02-tools:fs_tool-fs-search_tool-grep_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/fs/tool-fs-search/src/grep.ts:276-280`\n- 变量名称: 无（`ctx.systemPrompt.section({...})` 内联文本，section name 为 `tool:grep`）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——文件内容搜索工具 `grep`\n- 调用场景: 插件 `apply` 阶段注册到系统提示词；常驻模型上下文，指导模型用 `grep` 工具（而非 shell 的 grep/rg）搜索文件内容，并在需要上下文时对命中的文件使用 `read`\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nUse the grep tool — not shell grep or rg — to search file contents. Use read on a matched file when you need surrounding context.\n```\n\n## 中文翻译\n```text\n使用 grep 工具（而不是 shell 的 grep 或 rg）来搜索文件内容。当你需要命中文件周围的上下文时，对命中的文件使用 read。\n```\n\n## 关键参数\n- `pattern`：要搜索的正则表达式（ripgrep 语法）\n- `path`：要搜索的文件或目录；默认是会话工作区，相对路径按工作区解析\n- `include`：一个 glob 过滤器，用于限定搜索哪些文件（如 `\"*.ts\"`、`\"*.{js,jsx}\"`）；不是列表，不支持取反\n- `maxMatches`（配置 `caps.maxMatches`）：内联返回的最大匹配数；超限的结果会报告完整匹配列表保存的位置\n- 提示词本身无模板占位符\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-fs-search` 的 `applyGrepTool(ctx, caps)` 函数通过 `ctx.systemPrompt.section()` 静态注册（第 276-280 行），`caps` 为部署解析后的 grep 上限配置（含 `maxMatches`、`timeoutMs`）\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型搜索文件内容时遵循此指导\n- Section 注册: `name: 'tool:grep'`，`order: 104`（位于 100-199 工具指导带内，紧随 `tool:glob` 之后），指导的工具为 `grep`\n\n## 相关代码上下文\n`applyGrepTool(ctx: Context, caps: GrepToolCaps)`（`packages/fs/tool-fs-search/src/grep.ts:275`）注册提示词后调用 `ctx.tools.register(defineTool({ name: 'grep', ... }))`，执行使用 `subprocess` 服务。工具 description：\"Search file contents with a ripgrep regular expression. Returns matching lines with line numbers, grouped by file...\"（用 ripgrep 正则搜索文件内容，返回带行号的匹配行并按文件分组）。输出 schema 为 `matches` 数组（`path`/`lineNumber`/`line`），并通过 `presentGrepResult` 将 `presentationMeta` 投影为搜索卡片视图（`SearchResultView`，shape 为 `matches`），无搜索卡片时回退到通用 `tool/result` 内容。\n","02-tools:fs_tool-fs_tool-edit_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/fs/tool-fs/src/edit.ts:77-81`\n- 变量名称: 无（`ctx.systemPrompt.section({...})` 内联文本，section name 为 `tool:edit`）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——文件编辑工具 `edit`\n- 调用场景: 插件 `apply` 阶段注册到系统提示词；常驻模型上下文，指导模型对现有 UTF-8 文本文件做针对性修改（字面量替换），包括唯一匹配约束与 `replace_all` 的用法\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nUse the edit tool for targeted changes to existing UTF-8 text files. It replaces literal old_string with new_string; by default old_string must appear exactly once. If old_string appears multiple times, provide a more specific old_string or set replace_all to true. Read the file first (the default fs-observation-policy requires it), unless you just created or edited it in this session.\n```\n\n## 中文翻译\n```text\n使用 edit 工具对现有 UTF-8 文本文件做针对性修改。它用 new_string 替换字面量 old_string；默认情况下 old_string 必须恰好出现一次。如果 old_string 出现多次，请提供更具体的 old_string，或将 replace_all 设为 true。请先读取该文件（默认的 fs-observation-policy 要求如此），除非你刚在本会话中创建或编辑过它。\n```\n\n## 关键参数\n- `file_path`：要编辑的文件路径，由文件系统后端解析\n- `old_string`：要替换的字面量文本，必须精确匹配；默认须恰好出现一次（`parseEditArgs` 中要求非空）\n- `new_string`：替换文本，可为空字符串（用于删除匹配项）\n- `replace_all`：是否替换所有匹配项，默认 `false`；为 `false` 时 `old_string` 必须恰好出现一次\n- `fs-observation-policy`：默认的文件系统观测策略，要求编辑前先读取文件（保持原样不翻译）\n- `sandbox_permissions` / `justification`：提权字段，仅在受约束的 `ctx.fs` 下由 `sandbox.schemaFields()` 条件展开\n- 提示词本身无模板占位符\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-fs` 的 `applyEditTool(ctx, sandbox)` 函数通过 `ctx.systemPrompt.section()` 静态注册（第 77-81 行），`sandbox` 为共享的沙箱提权控制器\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型编辑文件时遵循此指导\n- Section 注册: `name: 'tool:edit'`，`order: 102`（位于 100-199 工具指导带内，紧随 `tool:write` 之后），指导的工具为 `edit`\n\n## 相关代码上下文\n`applyEditTool(ctx: Context, sandbox: FsSandboxController)`（`packages/fs/tool-fs/src/edit.ts:76`）注册提示词后调用 `ctx.tools.register(defineTool({ name: 'edit', ... }))`。参数校验由 `parseEditArgs`（第 47-57 行）完成：`file_path` 非空、`old_string` 非空、`old_string !== new_string`、`replace_all` 默认 false。成功结果由 `formatEditOutput` 渲染：`replace_all` 为 true 时输出 \"The file {path} has been updated. All occurrences were successfully replaced.\"，否则输出 \"The file {path} has been updated successfully.\"。输出 schema 含 `path`、`before`、`after` 三个字段。\n","02-tools:fs_tool-fs_tool-read_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/fs/tool-fs/src/read.ts:70-74`\n- 变量名称: 无（`ctx.systemPrompt.section({...})` 内联文本，section name 为 `tool:read`）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——文件读取工具 `read`\n- 调用场景: 插件 `apply` 阶段注册到系统提示词；常驻模型上下文，指导模型用 `read` 工具（而非 shell 命令）查看文本文件，并正确使用 `offset`/`limit` 分页读取大文件\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nUse the read tool — not shell commands like cat — to inspect text files. Results include line numbers. Use offset and limit to continue reading large files.\n```\n\n## 中文翻译\n```text\n请使用 read 工具（而不是 cat 之类的 shell 命令）来查看文本文件。结果包含行号。使用 offset 和 limit 继续读取大文件。\n```\n\n## 关键参数\n- `file_path`：要读取的文件路径，由文件系统后端解析（`resolved by the filesystem backend`）\n- `offset`：起始行号，1-based，默认 1；必须是正整数（`parseReadArgs` 中 `parsePositiveInteger` 校验）\n- `limit`：最大返回行数，默认取部署上限 `maxLimit`（`caps.limit`），且不能超过 `maxLimit`；必须是正整数\n- 提示词本身无模板占位符\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-fs` 的 `applyReadTool(ctx, caps)` 函数通过 `ctx.systemPrompt.section()` 静态注册（第 70-74 行），`caps` 为部署解析后的读取上限配置\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型读取文件时遵循此指导并传入 `file_path`/`offset`/`limit` 参数\n- Section 注册: `name: 'tool:read'`，`order: 100`（100-199 工具指导带的起始位置），指导的工具为 `read`\n\n## 相关代码上下文\n`applyReadTool(ctx: Context, caps: ReadToolCaps)`（`packages/fs/tool-fs/src/read.ts:69`）注册提示词后调用 `ctx.tools.register(defineTool({ name: 'read', ... }))` 注册工具本体。工具 description 为 \"Read a UTF-8 text file and return line-numbered content.\"（读取 UTF-8 文本文件并返回带行号的内容）。参数校验由 `parseReadArgs`（第 56-62 行）完成：`file_path` 非空、`offset`/`limit` 为正整数且 `limit <= maxLimit`。输出 schema 包含 `path`、`offset` 与 `lines`（`{number, text}` 数组）。该 section 的 order 100 是最低的工具指导顺序，位于所有工具指导的最前。\n","02-tools:fs_tool-fs_tool-write_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/fs/tool-fs/src/write.ts:63-67`\n- 变量名称: 无（`ctx.systemPrompt.section({...})` 内联文本，section name 为 `tool:write`）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——文件写入工具 `write`\n- 调用场景: 插件 `apply` 阶段注册到系统提示词；常驻模型上下文，指导模型何时使用 `write`（创建/整体替换）、覆盖语义，以及何时应改用 `edit`（针对性修改）\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nUse the write tool to create files or completely replace file contents. Existing files are overwritten, so read an existing file first (the default fs-observation-policy requires it) and prefer edit for targeted changes.\n```\n\n## 中文翻译\n```text\n使用 write 工具创建文件或完全替换文件内容。已有文件会被覆盖，因此请先读取现有文件（默认的 fs-observation-policy 要求如此）；针对性的修改应优先使用 edit 工具。\n```\n\n## 关键参数\n- `file_path`：要写入的路径，由文件系统后端解析\n- `content`：要写入的完整 UTF-8 文本内容（整文件替换语义）\n- `sandbox_permissions` / `justification`：仅在受约束的 `ctx.fs` 下出现在 schema 中的提权字段（由 `sandbox.schemaFields()` 条件展开），用于沙箱拒绝后的单次提权重试\n- `fs-observation-policy`：默认的文件系统观测策略，要求写前先读（保持原样不翻译）\n- 提示词本身无模板占位符\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-fs` 的 `applyWriteTool(ctx, sandbox)` 函数通过 `ctx.systemPrompt.section()` 静态注册（第 63-67 行），`sandbox` 为共享的沙箱提权控制器\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型写入文件时遵循此指导\n- Section 注册: `name: 'tool:write'`，`order: 101`（位于 100-199 工具指导带内，紧随 `tool:read` 之后），指导的工具为 `write`\n\n## 相关代码上下文\n`applyWriteTool(ctx: Context, sandbox: FsSandboxController)`（`packages/fs/tool-fs/src/write.ts:62`）注册提示词后调用 `ctx.tools.register(defineTool({ name: 'write', ... }))`。工具 description 为 \"Create or fully replace a UTF-8 text file.\"（创建或完全替换 UTF-8 文本文件）。输出 schema 含 `path`、`operation`（`create`/`update`）、`before`、`after`，并以 `formatWriteOutput` 渲染为模型可见的 `<path>/<type>/<content>` 结构（\"Created file\" / \"Updated file\"）。`WriteToolArgs` 接口（第 50-55 行）声明了提权字段，仅在受约束的 `ctx.fs` 下公布。\n","02-tools:fs_tool-str-replace-editor_file-view-prompt_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/fs/tool-str-replace-editor/src/index.ts:146`（前缀模板），`view_range` 后缀追加于第 177 行\n- 变量名称: `formatFileView(path, content, maxOutputChars, viewRange?)` 中的 `prompt` 模板\n- 功能模块: 字符串替换编辑器工具（str_replace_editor，文件系统能力缝的模型面对 Consumer）\n- 调用场景: `view` 命令读取文件后，生成带行号的文件内容视图，作为模型可见输出\n- 来源分类: 生产代码\n\n## 英文原文\n\n### 模板源码（第 146 行 + 第 177 行后缀）\n```\nHere's the content of ${path} with line numbers (which has a total of ${allLines.length} lines)[ with view_range=[${initialLine}, ${finalLine}]]\n```\n\n### 完整组装形态\n```\nHere's the content of <path> with line numbers (which has a total of <N> lines)[ with view_range=[<start>, <end>]]:\n<numbered lines>\n```\n\n## 中文翻译\n```\n这是 <path> 的内容，带有行号（该文件共 <N> 行）[，view_range=[<起始行>, <结束行>]]：\n<带行号的内容>\n```\n\n## 关键参数\n- `${path}` — 目标文件显示路径（`target.displayPath`）\n- `${allLines.length}` — 文件总行数\n- `${initialLine}` / `${finalLine}` — `view_range` 的起止行号；`finalLine === -1` 表示从 `initialLine` 到文件末尾；未提供 `view_range` 时显示完整文件且无该后缀\n- `${numbered}` — 从 `initialLine` 起逐行编号的文本，行号 6 位宽度右对齐 + 两个空格 + 行内容（`String(initialLine + index).padStart(6, ' ')`）\n- 结尾 `:\\n` 与截断：整段经 `maybeTruncate` 处理，超过 `maxOutputChars`（默认 16000 字符）时附加 `<response clipped><NOTE>...` 截断标记\n\n## Few-shot 示例\n无（`DEFAULT_DESCRIPTION` 中含 str_replace 使用说明与截断示例，属于工具 description，不属于本视图提示词）\n\n## 提示词链路\n- 上游: `viewPath()`（第 216-237 行）读取文件文本后调用 `formatFileView(target.displayPath, content, maxOutputChars, viewRange)`\n- 下游: 返回字符串作为 `view` 命令的工具结果文本（`output.schema: {type:'string'}`），直接进入模型请求；`ctx.emit('fs/observed', ...)` 记录文件观察事件\n- 注入时机与 order: 工具执行结果通道，非 `systemPrompt.section` 注入，无 order。目录路径走 `listDirectory`（`Here're the files and directories up to 2 levels deep ...`，第 213 行），与文件视图为两条分支\n\n## 相关代码上下文\n`tool-str-replace-editor/src/index.ts`：`formatFileView` 定义于第 136-183 行；`maybeTruncate`（第 32-36 行）与 `TRUNCATED_MESSAGE`（第 17 行）；`view_range` 校验在函数内完成（第 147-177 行，含 `finalLine !== -1 && finalLine < initialLine` 等错误）；`viewPath` 经 `statExisting` 区分文件/目录/缺失路径。\n","02-tools:jobs_tool-jobs_tool-jobs_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/jobs/tool-jobs/src/index.ts:263-267`\n- 变量名称: 无（`ctx.systemPrompt.section({...})` 内联文本，section name 为 `tool:jobs`）\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——后台任务跟踪工具集（`job_output` / `job_kill` / `job_list`）\n- 调用场景: 插件 `apply` 阶段注册到系统提示词；常驻模型上下文，指导模型如何管理自己启动的后台任务（跟踪、收尾、避免忙轮询）\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nTrack every background job id you start. You are notified in-session when a job finishes — do not busy-poll or sleep on one; keep working on independent steps and do not duplicate a running job's work. Before giving a final answer, collect every still-relevant job with job_output (set wait: true only when you are genuinely blocked on it), and job_kill jobs that stopped mattering.\n```\n\n## 中文翻译\n```text\n跟踪你启动的每一个后台任务 id。任务完成时你会收到会话内通知——不要对某个任务忙轮询或 sleep 等待；继续处理独立的步骤，不要重复正在运行的任务的工作。在给出最终答复之前，用 job_output 收集每一个仍然相关的任务（只有当你确实被它阻塞时才设置 wait: true），并用 job_kill 结束那些已不再重要的任务。\n```\n\n## 关键参数\n- `job id`：后台任务标识符，由启动任务的工具返回，模型需逐个跟踪\n- `job_output`：读取后台任务结果的工具名；`wait: true` 为其参数，仅当模型确实被该任务阻塞时才设置（等待有上限）\n- `job_kill`：终止后台任务的工具名\n- 无其他模板占位符；`[status: ...]` 等结果标记由 `job_output` 工具的 description 另行说明\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-jobs` 插件的 `apply` 通过 `ctx.systemPrompt.section()` 静态注册，无运行时输入\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型在管理后台任务生命周期时遵循此规则（代码注释：\"Producers may start work only while a controller is attached.\"，即 `ctx.jobs.attachController('tool-jobs')` 之后）\n- Section 注册: `name: 'tool:jobs'`，`order: 106`（位于 100-199 工具指导带内，紧随 `tool:bash`/`tool:pwsh` 的 105 之后、产品 section 之前），指导的工具为 `job_output` / `job_kill` / `job_list`\n\n## 相关代码上下文\n注册位置在 `ctx.jobs.attachController('tool-jobs')`（第 260 行）之后、`ctx.tools.register`（`job_output`、`job_kill` 等）之前（第 263-267 行）。同文件实现了任务完成通知机制：`ctx.jobs.onJobDone` 监听任务结算，通过 `owner.inject` / `owner.followup` 把完成通知注入所属 Agent 的下一步收件箱（busy owner 排队、idle owner 唤醒），并有 `outputLimits` / `finalizeTaskContent` 对输出做字节上限截断（`fitWithSuffix`、`[output truncated]` 标记）。提示词与这些机制配合：模型无需轮询，因为会话内会自动收到完成通知。\n","02-tools:lsp_tool-lsp_lsp-prompt_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/lsp/tool-lsp/src/index.ts:54-55`（注册处：第 104 行）\n- 变量名称: `LSP_PROMPT_TEXT`\n- 功能模块: 工具使用指导层（Tool Usage Guidance）——语言服务器（LSP）代码导航工具\n- 调用场景: 插件 `apply` 阶段作为 section `tool:lsp` 注册到系统提示词；常驻模型上下文，指导模型在何种场景使用 `lsp` 工具进行精确的代码导航（定义/引用/实现/hover）\n- 来源分类: 生产代码\n\n## 英文原文\n```text\nUse search/read for ordinary navigation. Use lsp when textual matches are ambiguous or before a change requires precise definitions, implementations, or references. Positions are one-based line and character (UTF-16) at the cursor; an off-symbol position may return no results. findReferences always includes the declaration.\n```\n\n## 中文翻译\n```text\n常规导航请使用 search/read。当文本匹配存在歧义，或在进行修改之前需要精确的定义、实现或引用时，请使用 lsp。位置是光标处的从 1 开始计数的行号和字符偏移（UTF-16）；偏离符号的位置可能返回空结果。findReferences 始终包含声明本身。\n```\n\n## 关键参数\n- `operation`：LSP 操作类型，取值为 `goToDefinition` / `findReferences` / `goToImplementation` / `hover`（工具 schema 中的 `enum`，由 `LSP_OPERATIONS` 定义）\n- `line` / `character`：光标坐标，均为 1-based 的 UTF-16 行号和字符偏移（工具 schema 输出 `LSP_POSITION_OUTPUT_SCHEMA`）\n- `findReferences`：引用查询操作，其返回结果必然包含声明位置（与提示词所述一致）\n- 提示词本身无模板占位符\n\n## Few-shot 示例\n无\n\n## 提示词链路\n- 上游: 由 `tool-lsp` 插件的 `apply` 通过 `ctx.systemPrompt.section({ name: 'tool:lsp', order: 112, text: LSP_PROMPT_TEXT })` 静态注册（第 104 行），无运行时输入\n- 下游: 注册进 `systemPrompt` 服务，按 `order` 排序渲染进最终系统提示词；模型据此决定何时调用 `lsp` 工具，并按 1-based UTF-16 坐标传递参数\n- Section 注册: `name: 'tool:lsp'`，`order: 112`（位于 100-199 工具指导带内，在 web 工具之后），指导的工具为 `lsp`\n- 常量注释说明其定位：\"The stable system-prompt guidance positioning LSP as a precision aid.\"（把 LSP 定位为精准辅助的稳定系统提示词指导）\n\n## 相关代码上下文\n`LSP_PROMPT_TEXT` 定义于 `packages/lsp/tool-lsp/src/index.ts:54-55`，是导出常量；`apply` 函数（第 98-104 行）先做配置校验（`assertPositiveInteger`/`assertTimer`），再注册提示词 section，随后注册 `lsp` 工具（`defineTool({ name: 'lsp', ... })`）。工具的 description 与提示词语义一致：`operation is one of goToDefinition, findReferences, goToImplementation, hover. line and character are one-based UTF-16 cursor coordinates. findReferences includes the declaration.` 工具调用预算默认 `DEFAULT_LSP_TOOL_TIMEOUT_MS = 60_000`，覆盖排队 open/query/close 的完整生命周期。\n","02-tools:shell_tool-bash_bash-description_prompt_zh.md":"# 提示词翻译文档\n\n## 元信息\n- 原文件位置: `packages/shell/tool-bash/src/index.ts:70-93`\n- 变量名称: `bashDescription(backgroundEnabled, escalationModes)`（模板函数，返回 `bash` 工具的 `description`）\n- 功能模块: bash 工具（`ctx.shell` 能力缝的模型面对 Consumer）\n- 调用场景: 插件加载时组装 `bash` 工具的完整描述，随工具 schema 进入模型上下文，指导命令执行、沙箱拒绝处理与同回合升级\n- 来源分类: 生产代码\n\n## 英文原文\n\n### 组装后的完整提示词（backgroundEnabled = true 且 escalationModes 非空的典型组合）\n```\nExecute a bash command (`bash -c`) and return its stdout/stderr. Each call runs in a fresh shell: no state (cwd, variables, functions) persists between calls — pass `workdir` instead of using `cd`. Non-zero exits are reported as `[exit code: N]`. Current harness environment facts are exposed through managed `$DSH_*` variables; inspect them when needed. Commands may run under a file sandbox; a blocked file operation is reported as `[sandbox: file access denied under <mode> mode]` — a policy denial, not a bug in the command; do not retry another way. Long output is truncated to its tail; the full output is saved to a file whose path is reported when available. Set `run_in_background: true` for long-running commands: the call returns a job id immediately; read its output with `job_output` and stop it with `job_kill`. Attempting a command the sandbox may deny is safe and expected: run it and read the marker rather than assuming the denial. When a command is denied and a wider mode would let it succeed, escalate immediately in the same turn — the one sanctioned exception to a denial: retry the exact same command once with `sandbox_permissions` (the narrowest wider mode that suffices) plus a one-sentence `justification`. Do not detour through chat to ask permission first — the approval prompt raised by that retry is how the user consents. If the session states approval prompts are disabled, there is no exception: a denial is final — do not set `sandbox_permissions`. Nev
