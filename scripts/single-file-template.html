<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness 学习站</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2329;
    --muted: #6b7280;
    --brand: #4e83fd;
    --brand-dark: #3b6ff0;
    --code-bg: #f0f2f5;
    --tip-bg: #eef6ff;
    --tip-border: #4e83fd;
    --warn-bg: #fff7e6;
    --warn-border: #f5a623;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
    font-size: 15px;

  .layout { display: flex; height: 100vh; }
  /* 侧边栏 */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;

  .sidebar-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);

  .sidebar-head .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--brand);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;

    color: var(--muted);
    margin-top: 4px;
  }
  .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;

  .search-box input:focus { border-color: var(--brand); }
  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;

  .nav-group { margin-bottom: 4px; }
  .nav-group-title {
    padding: 8px 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;

  .nav-group-title .arrow { transition: transform .2s; font-size: 10px; }
  .nav-group.collapsed .arrow { transform: rotate(-90deg); }
  .nav-item {
    display: block;
    padding: 6px 20px 6px 32px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    border-left: 3px solid transparent;

  .nav-item.active {

  .content h4 { font-size: 16px; margin: 20px 0 8px; }

    color: #e6e8eb;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;

  .content th, .content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }

  .content a { color: var(--brand); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content ul, .content ol { padding-left: 24px; margin: 8px 0; }
  .content li { margin: 4px 0; }
  .content blockquote {

    color: var(--muted);
    background: #f9fafb;
    border-radius: 0 6px 6px 0;

  .content .tip, .content .warning {

    border-radius: 8px;

<script>

// ===== 极简 Markdown 渲染器 =====
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderInline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let i = 0;
  let inCode = false, codeLang = '', codeBuf = [];
  let inTable = false, tableBuf = [];
  let inList = false, listType = '';
  function closeList() { if (inList) { html += '</' + listType + '>'; inList = false; } }
  function closeTable() {
    if (inTable) {
      let t = '<table>';
      tableBuf.forEach((row, ri) => {
        const cells = row.split('|').slice(1, -1).map(c => c.trim());
        t += '<tr>';
        cells.forEach(c => {
          t += (ri === 0 ? '<th>' : '<td>') + renderInline(c) + (ri === 0 ? '</th>' : '</td>');
        });
        t += '</tr>';
      });
      html += t + '</table>';
      inTable = false; tableBuf = [];
    }
  }
  function flushContainer(buf, kind) {
    const title = kind === 'tip' ? '提示' : (kind === 'warning' ? '注意' : kind);
    html += '<div class="' + kind + '"><span class="ttl">' + title + '</span>' + renderMarkdown(buf.join('\n')) + '</div>';
  }
  while (i < lines.length) {
    const line = lines[i];
    // 代码块
    const codeMatch = line.match(/^```(.*)$/);
    if (codeMatch) {
      if (!inCode) { inCode = true; codeLang = codeMatch[1].trim(); codeBuf = []; closeList(); closeTable(); }
      else { html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'; inCode = false; codeBuf = []; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    // VitePress 容器 ::: tip / ::: warning
    const containerStart = line.match(/^:::\s*(\w+)(.*)$/);
    if (containerStart) {
      const kind = containerStart[1] === 'warning' ? 'warning' : 'tip';
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith(':::')) { buf.push(lines[i]); i++; }
      i++; // 跳过 :::
      closeList(); closeTable();
      flushContainer(buf, kind);
      continue;
    }
    // 表格
    if (/^\|.*\|$/.test(line)) {
      closeList();
      if (!inTable) inTable = true;
      tableBuf.push(line);
      i++; continue;
    } else { closeTable(); }
    // 标题
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const lv = h[1].length; html += '<h' + lv + '>' + renderInline(h[2]) + '</h' + lv + '>'; i++; continue; }
    // 分隔线
    if (/^\s*---+\s*$/.test(line)) { closeList(); html += '<hr>'; i++; continue; }
    // 引用
    if (/^>\s?/.test(line)) { closeList(); html += '<blockquote>' + renderInline(line.replace(/^>\s?/, '')) + '</blockquote>'; i++; continue; }
    // 无序列表
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inList || listType !== 'ul') { closeList(); html += '<ul>'; inList = true; listType = 'ul'; }
      html += '<li>' + renderInline(line.replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; continue;
    }
    // 有序列表
    if (/^\s*\d+\.\s+/.test(line)) {
      if (!inList || listType !== 'ol') { closeList(); html += '<ol>'; inList = true; listType = 'ol'; }
      html += '<li>' + renderInline(line.replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++; continue;
    }
    // 空行
    if (line.trim() === '') { closeList(); i++; continue; }
    // 普通段落
    closeList();
    html += '<p>' + renderInline(line) + '</p>';
    i++;
  }
  closeList(); closeTable();
  if (inCode) html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>';
  return html;
}

    for (const it of g.items) {
      h += '<div class="nav-item" data-id="' + it.id + '" onclick="show(' + JSON.stringify(it.id) + ')">' + escapeHtml(it.title) + '</div>';
    }
    h += '</div>';
  }
  nav.innerHTML = h;
}
function toggleGroup(el) {
  el.parentElement.classList.toggle('collapsed');
}
function show(id) {
  const item = DATA.contents[id];
  const content = document.getElementById('content');
  if (id === 'home' || !item) {
    renderHome();
  } else {
    content.innerHTML = renderMarkdown(item);
    window.scrollTo(0, 0);
  }
  // 高亮当前项
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const el = document.querySelector('.nav-item[data-id="' + id + '"]');
  if (el) el.classList.add('active');
  // 展开所属分组
  if (el) el.closest('.nav-group').classList.remove('collapsed');
}

}
function jumpFirstPrompt() {
  const first = DATA.groups.find(g => g.items.length > 0);
  if (first) show(first.items[0].id);
}
function onSearch(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.nav-item').forEach(n => {
    const id = n.dataset.id;
    const title = n.textContent.toLowerCase();
    const md = (DATA.contents[id] || '').toLowerCase();
    const hit = !q || title.includes(q) || md.includes(q);
    n.style.display = hit ? '' : 'none';
    // 分组有命中项时展开
    const grp = n.closest('.nav-group');
    if (grp && q && hit) grp.classList.remove('collapsed');
  });
  document.querySelectorAll('.nav-group').forEach(g => {
    const hasVisible = [...g.querySelectorAll('.nav-item')].some(n => n.style.display !== 'none');
    g.style.display = (q && !hasVisible) ? 'none' : '';
  });
}

// 初始化
buildNav();
renderHome();
</script>
